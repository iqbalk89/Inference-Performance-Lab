<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
  <title id="title">Unbatched versus batched request paths through a GPU</title>
  <desc id="desc">A two-stage architecture diagram comparing four sequential single-request GPU passes with one four-request batched pass, showing host requests, the GPU entity, VRAM, shared model weights, per-request KV caches, the memory fabric, streaming multiprocessors, and separate outputs.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#142f49"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#0a192b"/></linearGradient>
    <linearGradient id="gpu" x2="1" y2="1"><stop stop-color="#183c56"/><stop offset="1" stop-color="#0b2236"/></linearGradient>
    <linearGradient id="vram" x2="1" y2="1"><stop stop-color="#392d18"/><stop offset="1" stop-color="#241b10"/></linearGradient>
    <linearGradient id="sm" x2="1" y2="1"><stop stop-color="#0d6571"/><stop offset="1" stop-color="#124457"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".48"/></filter>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/></marker>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker>
    <marker id="goldArrowFixed" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker>
    <style>
      .title{font:700 34px Inter,system-ui,sans-serif;fill:#f8fafc}.sub{font:500 17px Inter,system-ui,sans-serif;fill:#c8dcf0}
      .stage{font:700 24px Inter,system-ui,sans-serif;fill:#f8fafc}.h{font:700 18px Inter,system-ui,sans-serif;fill:#f8fafc}
      .body{font:500 15px Inter,system-ui,sans-serif;fill:#dbeafe}.small{font:500 13px Inter,system-ui,sans-serif;fill:#cbd5e1}
      .tiny{font:600 12px Inter,system-ui,sans-serif;fill:#d5e5f3}.mono{font:700 16px 'SFMono-Regular',Menlo,monospace;fill:#f8fafc}
      .panel{fill:url(#panel);stroke:#38546e;stroke-width:2}.gpu{fill:url(#gpu);stroke:#4f7a98;stroke-width:2.5}
      .flow{fill:none;stroke:#7dd3fc;stroke-width:4;stroke-linecap:round;marker-end:url(#cyanArrow)}
      .memory{fill:none;stroke:#fbbf24;stroke-width:4;stroke-linecap:round;marker-end:url(#goldArrow)}
      .dash{fill:none;stroke:#7b96ad;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1800" height="1420" fill="url(#bg)"/>
  <text x="55" y="58" class="title">How batching changes the path through the GPU</text>
  <text x="55" y="91" class="sub">Same four requests, same resident model weights—either four small passes or one wider batched pass.</text>

  <!-- stage 1 -->
  <rect x="45" y="125" width="1710" height="485" rx="24" class="panel" filter="url(#shadow)"/>
  <text x="75" y="169" class="stage">Stage 1 — Unbatched: B = 1, repeated four times</text>
  <text x="75" y="198" class="small">Each request launches a separate forward pass. The model has one copy in VRAM, but its weights feed four separate executions over time.</text>

  <g transform="translate(75 240)">
    <text x="0" y="0" class="h">Host request queue</text>
    <rect x="0" y="25" width="230" height="52" rx="10" fill="#2563eb"/><text x="115" y="57" text-anchor="middle" class="mono">A • [1, T]</text>
    <rect x="0" y="88" width="230" height="52" rx="10" fill="#0d9488"/><text x="115" y="120" text-anchor="middle" class="mono">B • [1, T]</text>
    <rect x="0" y="151" width="230" height="52" rx="10" fill="#c2410c"/><text x="115" y="183" text-anchor="middle" class="mono">C • [1, T]</text>
    <rect x="0" y="214" width="230" height="52" rx="10" fill="#7c3aed"/><text x="115" y="246" text-anchor="middle" class="mono">D • [1, T]</text>
    <text x="0" y="298" class="tiny">Four calls • four launch sequences</text>
  </g>
  <path d="M320 292 C370 292 372 330 425 330 M320 355 C372 355 374 370 425 370 M320 418 C372 418 374 410 425 410 M320 481 C372 481 374 450 425 450" class="flow"/>

  <rect x="425" y="225" width="1285" height="335" rx="20" class="gpu"/>
  <text x="452" y="260" class="h">GPU entity</text>
  <rect x="455" y="280" width="405" height="235" rx="15" fill="url(#vram)" stroke="#c9902b" stroke-width="2"/>
  <text x="478" y="314" class="h">VRAM / HBM</text>
  <rect x="480" y="335" width="355" height="70" rx="10" fill="#67470f" stroke="#fbbf24"/><text x="657" y="365" text-anchor="middle" class="h">Model weights • ≈3.09 GB</text><text x="657" y="390" text-anchor="middle" class="tiny">one resident allocation, shared by every request</text>
  <rect x="480" y="425" width="78" height="54" rx="8" fill="#214d7b"/><rect x="570" y="425" width="78" height="54" rx="8" fill="#17685f"/><rect x="660" y="425" width="78" height="54" rx="8" fill="#86401f"/><rect x="750" y="425" width="78" height="54" rx="8" fill="#5a3b92"/>
  <text x="519" y="457" text-anchor="middle" class="tiny">KV A</text><text x="609" y="457" text-anchor="middle" class="tiny">KV B</text><text x="699" y="457" text-anchor="middle" class="tiny">KV C</text><text x="789" y="457" text-anchor="middle" class="tiny">KV D</text>
  <text x="478" y="500" class="tiny">Per-request state stays separate.</text>

  <rect x="910" y="280" width="285" height="235" rx="15" fill="#13263a" stroke="#7891a8" stroke-width="2"/>
  <text x="1052" y="315" text-anchor="middle" class="h">Memory fabric</text>
  <text x="1052" y="346" text-anchor="middle" class="small">weights + KV + activations</text>
  <path d="M938 380 H1168 M938 418 H1168 M938 456 H1168" class="dash"/>
  <text x="1052" y="397" text-anchor="middle" class="tiny">pass A</text><text x="1052" y="435" text-anchor="middle" class="tiny">pass B / C</text><text x="1052" y="473" text-anchor="middle" class="tiny">pass D</text>
  <path d="M860 360 H910" class="memory"/><path d="M860 453 H910" class="memory"/>

  <rect x="1250" y="280" width="425" height="235" rx="15" fill="url(#sm)" stroke="#22d3ee" stroke-width="2"/>
  <text x="1462" y="315" text-anchor="middle" class="h">SMs / Tensor Cores</text>
  <rect x="1280" y="342" width="365" height="38" rx="7" fill="#2563eb"/><text x="1462" y="367" text-anchor="middle" class="tiny">time 1: execute A • small GEMMs</text>
  <rect x="1280" y="389" width="365" height="38" rx="7" fill="#0d9488"/><text x="1462" y="414" text-anchor="middle" class="tiny">time 2: execute B • small GEMMs</text>
  <rect x="1280" y="436" width="365" height="38" rx="7" fill="#c2410c"/><text x="1462" y="461" text-anchor="middle" class="tiny">time 3/4: execute C, then D</text>
  <text x="1462" y="498" text-anchor="middle" class="small">More launches; less parallel work per launch</text>
  <path d="M1195 398 H1250" class="memory"/>

  <!-- stage 2 -->
  <rect x="45" y="640" width="1710" height="500" rx="24" class="panel" filter="url(#shadow)"/>
  <text x="75" y="684" class="stage">Stage 2 — Batched: B = 4, one wider pass</text>
  <text x="75" y="713" class="small">The batcher stacks A–D on the leading B axis. One batched operation reuses the same weights across four independent rows of work.</text>

  <g transform="translate(75 760)">
    <text x="0" y="0" class="h">Batcher</text>
    <rect x="0" y="25" width="245" height="220" rx="14" fill="#122c43" stroke="#22d3ee" stroke-width="2"/>
    <rect x="22" y="47" width="201" height="35" rx="6" fill="#2563eb"/><rect x="22" y="91" width="201" height="35" rx="6" fill="#0d9488"/><rect x="22" y="135" width="201" height="35" rx="6" fill="#c2410c"/><rect x="22" y="179" width="201" height="35" rx="6" fill="#7c3aed"/>
    <text x="122" y="70" text-anchor="middle" class="tiny">batch item 0 • A</text><text x="122" y="114" text-anchor="middle" class="tiny">batch item 1 • B</text><text x="122" y="158" text-anchor="middle" class="tiny">batch item 2 • C</text><text x="122" y="202" text-anchor="middle" class="tiny">batch item 3 • D</text>
    <text x="122" y="236" text-anchor="middle" class="mono">[4, T]</text>
    <text x="0" y="278" class="tiny">One call • one launch sequence per op</text>
  </g>
  <path d="M320 895 H425" class="flow" marker-end="url(#cyanArrow)"/>

  <rect x="425" y="740" width="1285" height="345" rx="20" class="gpu"/>
  <text x="452" y="775" class="h">GPU entity</text>
  <rect x="455" y="795" width="405" height="245" rx="15" fill="url(#vram)" stroke="#c9902b" stroke-width="2"/>
  <text x="478" y="829" class="h">VRAM / HBM</text>
  <rect x="480" y="850" width="355" height="70" rx="10" fill="#67470f" stroke="#fbbf24"/><text x="657" y="880" text-anchor="middle" class="h">Same model weights • ≈3.09 GB</text><text x="657" y="905" text-anchor="middle" class="tiny">not copied four times for B=4</text>
  <rect x="480" y="940" width="78" height="54" rx="8" fill="#214d7b"/><rect x="570" y="940" width="78" height="54" rx="8" fill="#17685f"/><rect x="660" y="940" width="78" height="54" rx="8" fill="#86401f"/><rect x="750" y="940" width="78" height="54" rx="8" fill="#5a3b92"/>
  <text x="519" y="972" text-anchor="middle" class="tiny">KV A</text><text x="609" y="972" text-anchor="middle" class="tiny">KV B</text><text x="699" y="972" text-anchor="middle" class="tiny">KV C</text><text x="789" y="972" text-anchor="middle" class="tiny">KV D</text>
  <text x="478" y="1017" class="tiny">KV memory grows with B; weights do not.</text>

  <rect x="910" y="795" width="285" height="245" rx="15" fill="#13263a" stroke="#fbbf24" stroke-width="2"/>
  <text x="1052" y="829" text-anchor="middle" class="h">Wide memory path</text>
  <text x="1052" y="860" text-anchor="middle" class="small">one shared batched weight stream</text>
  <path d="M940 895 H1165" stroke="#fbbf24" stroke-width="18" stroke-linecap="round" marker-end="url(#goldArrowFixed)"/>
  <path d="M940 950 H1165" stroke="#2563eb" stroke-width="7"/><path d="M940 965 H1165" stroke="#0d9488" stroke-width="7"/><path d="M940 980 H1165" stroke="#c2410c" stroke-width="7"/><path d="M940 995 H1165" stroke="#7c3aed" stroke-width="7"/>
  <text x="1052" y="1022" text-anchor="middle" class="tiny">four request-specific KV/data lanes</text>
  <path d="M860 885 H910" class="memory"/><path d="M860 970 H910" class="memory"/>

  <rect x="1250" y="795" width="425" height="245" rx="15" fill="url(#sm)" stroke="#22d3ee" stroke-width="2"/>
  <text x="1462" y="829" text-anchor="middle" class="h">SMs / Tensor Cores</text>
  <text x="1462" y="858" text-anchor="middle" class="small">one larger batched GEMM</text>
  <rect x="1280" y="882" width="365" height="112" rx="10" fill="#16334b" stroke="#7dd3fc"/>
  <rect x="1300" y="900" width="325" height="17" rx="5" fill="#2563eb"/><rect x="1300" y="925" width="325" height="17" rx="5" fill="#0d9488"/><rect x="1300" y="950" width="325" height="17" rx="5" fill="#c2410c"/><rect x="1300" y="975" width="325" height="17" rx="5" fill="#7c3aed"/>
  <text x="1462" y="1020" text-anchor="middle" class="small">more parallel work • better weight reuse</text>
  <path d="M1195 920 H1250" class="memory"/>

  <!-- explicit throughput comparison -->
  <rect x="45" y="1165" width="1710" height="155" rx="20" class="panel" filter="url(#shadow)"/>
  <text x="75" y="1202" class="h">Why aggregate throughput can improve</text>
  <text x="75" y="1228" class="small">Unbatched completion timeline</text>
  <rect x="75" y="1242" width="135" height="30" rx="5" fill="#2563eb"/><rect x="218" y="1242" width="135" height="30" rx="5" fill="#0d9488"/><rect x="361" y="1242" width="135" height="30" rx="5" fill="#c2410c"/><rect x="504" y="1242" width="135" height="30" rx="5" fill="#7c3aed"/>
  <text x="142" y="1263" text-anchor="middle" class="tiny">pass A</text><text x="285" y="1263" text-anchor="middle" class="tiny">pass B</text><text x="428" y="1263" text-anchor="middle" class="tiny">pass C</text><text x="571" y="1263" text-anchor="middle" class="tiny">pass D</text>
  <text x="75" y="1298" class="mono">4 requests / 4 separate pass windows</text>
  <text x="720" y="1228" class="small">Batched completion timeline</text>
  <rect x="720" y="1242" width="430" height="30" rx="5" fill="#16334b" stroke="#7dd3fc"/>
  <rect x="735" y="1248" width="94" height="18" rx="4" fill="#2563eb"/><rect x="838" y="1248" width="94" height="18" rx="4" fill="#0d9488"/><rect x="941" y="1248" width="94" height="18" rx="4" fill="#c2410c"/><rect x="1044" y="1248" width="94" height="18" rx="4" fill="#7c3aed"/>
  <text x="720" y="1298" class="mono">4 requests / 1 wider pass window</text>
  <rect x="1210" y="1205" width="510" height="92" rx="13" fill="#123b52" stroke="#38bdf8" stroke-width="2"/>
  <text x="1465" y="1237" text-anchor="middle" class="mono">throughput = completed tokens / second</text>
  <text x="1465" y="1264" text-anchor="middle" class="small">If one batched pass takes less time than four small passes,</text>
  <text x="1465" y="1285" text-anchor="middle" class="small">aggregate token throughput rises—even if latency/request also rises.</text>

  <rect x="75" y="1340" width="1650" height="64" rx="12" fill="#0b1b2d" stroke="#38546e"/>
  <text x="900" y="1367" text-anchor="middle" class="small">Precise meaning of “read once”: weights occupy one VRAM allocation and are shared across batch rows within a batched operation.</text>
  <text x="900" y="1389" text-anchor="middle" class="small">Physical cache and HBM transactions still depend on kernel tiling, on-chip caches, and hardware behavior.</text>
</svg>
