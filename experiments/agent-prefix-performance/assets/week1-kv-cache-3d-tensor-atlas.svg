<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760" role="img" aria-labelledby="title desc">
  <title id="title">Three-dimensional tensor atlas for Qwen2.5-1.5B grouped-query attention and KV cache</title>
  <desc id="desc">An isometric technical diagram of hidden states, projection weight matrices, query key and value tensors, grouped-query attention, attention score tensors, the per-layer and full-model KV cache, and decode-time cache append.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14233d"/></linearGradient>
    <linearGradient id="xFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#475569"/><stop offset="1" stop-color="#273449"/></linearGradient>
    <linearGradient id="qFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="kFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="vFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="sFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#be123c"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
    <style>
      .title{font:700 31px system-ui,sans-serif;fill:#f8fafc}.sub{font:600 18px system-ui,sans-serif;fill:#cbd5e1}
      .panelTitle{font:700 22px system-ui,sans-serif;fill:#f8fafc}.label{font:700 17px system-ui,sans-serif;fill:#f8fafc}
      .body{font:15px system-ui,sans-serif;fill:#cbd5e1}.small{font:13px system-ui,sans-serif;fill:#cbd5e1}
      .mono{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}.monoSm{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}
      .panel{fill:#0e1a2e;stroke:#334155;stroke-width:1.5}.arrow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.axis{fill:none;stroke:#f8fafc;stroke-width:1.5;marker-end:url(#arrow)}
      .dim{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}.note{fill:#17243a;stroke:#475569;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1600" height="1760" rx="26" fill="url(#bg)"/>
  <text x="55" y="52" class="title">3-D tensor atlas: Qwen2.5-1.5B attention and KV cache</text>
  <text x="55" y="82" class="sub">Exact logical shapes for batch 1, 512-token prefill, FP16, 12 query heads, 2 KV heads, head dimension 128, 28 layers</text>

  <!-- legend -->
  <rect x="1260" y="25" width="285" height="75" rx="11" class="note"/>
  <rect x="1280" y="43" width="25" height="12" fill="#7c3aed"/><text x="1314" y="54" class="small">Query / query projection</text>
  <rect x="1280" y="66" width="25" height="12" fill="#0891b2"/><text x="1314" y="77" class="small">Key</text>
  <rect x="1410" y="66" width="25" height="12" fill="#059669"/><text x="1444" y="77" class="small">Value</text>

  <!-- Panel A -->
  <rect x="40" y="120" width="1520" height="555" rx="20" class="panel"/>
  <text x="70" y="158" class="panelTitle">A  Prefill: project hidden states, then reshape into heads</text>

  <!-- X cuboid -->
  <g>
    <polygon points="95,245 125,220 305,220 275,245" fill="#64748b" opacity=".75"/>
    <polygon points="275,245 305,220 305,485 275,510" fill="#1e293b"/>
    <rect x="95" y="245" width="180" height="265" rx="4" fill="url(#xFront)" stroke="#94a3b8"/>
    <text x="185" y="282" text-anchor="middle" class="label">Hidden states X</text>
    <text x="185" y="310" text-anchor="middle" class="mono">[B, T, H]</text>
    <text x="185" y="338" text-anchor="middle" class="mono">[1, 512, 1536]</text>
    <line x1="95" y1="535" x2="275" y2="535" class="axis"/><text x="185" y="558" text-anchor="middle" class="dim">H = 1536</text>
    <line x1="70" y1="510" x2="70" y2="245" class="axis"/><text x="55" y="390" transform="rotate(-90 55 390)" text-anchor="middle" class="dim">T = 512 tokens</text>
    <line x1="282" y1="238" x2="312" y2="213" class="axis"/><text x="322" y="213" class="dim">B = 1</text>
  </g>

  <!-- projection matrices -->
  <path d="M320 365 L395 365" class="arrow"/>
  <g>
    <polygon points="405,210 425,194 585,194 565,210" fill="#a78bfa" opacity=".75"/><polygon points="565,210 585,194 585,295 565,311" fill="#4c1d95"/>
    <rect x="405" y="210" width="160" height="101" fill="url(#qFront)" stroke="#c4b5fd"/>
    <text x="485" y="240" text-anchor="middle" class="label">Wq</text><text x="485" y="266" text-anchor="middle" class="monoSm">[1536, 1536]</text><text x="485" y="290" text-anchor="middle" class="small">12 × 128 outputs</text>
    <polygon points="405,340 425,324 585,324 565,340" fill="#67e8f9" opacity=".75"/><polygon points="565,340 585,324 585,425 565,441" fill="#164e63"/>
    <rect x="405" y="340" width="160" height="101" fill="url(#kFront)" stroke="#67e8f9"/>
    <text x="485" y="370" text-anchor="middle" class="label">Wk</text><text x="485" y="396" text-anchor="middle" class="monoSm">[256, 1536]</text><text x="485" y="420" text-anchor="middle" class="small">2 × 128 outputs</text>
    <polygon points="405,470 425,454 585,454 565,470" fill="#6ee7b7" opacity=".75"/><polygon points="565,470 585,454 585,555 565,571" fill="#064e3b"/>
    <rect x="405" y="470" width="160" height="101" fill="url(#vFront)" stroke="#6ee7b7"/>
    <text x="485" y="500" text-anchor="middle" class="label">Wv</text><text x="485" y="526" text-anchor="middle" class="monoSm">[256, 1536]</text><text x="485" y="550" text-anchor="middle" class="small">2 × 128 outputs</text>
  </g>

  <path d="M585 255 L665 255" class="arrow"/><path d="M585 390 L665 390" class="arrow"/><path d="M585 520 L665 520" class="arrow"/>

  <!-- flattened outputs -->
  <g>
    <rect x="675" y="210" width="205" height="90" rx="8" fill="#4c1d95" stroke="#a78bfa"/><text x="777" y="240" text-anchor="middle" class="label">Q before reshape</text><text x="777" y="270" text-anchor="middle" class="mono">[1, 512, 1536]</text>
    <rect x="675" y="345" width="205" height="90" rx="8" fill="#164e63" stroke="#67e8f9"/><text x="777" y="375" text-anchor="middle" class="label">K before reshape</text><text x="777" y="405" text-anchor="middle" class="mono">[1, 512, 256]</text>
    <rect x="675" y="475" width="205" height="90" rx="8" fill="#064e3b" stroke="#6ee7b7"/><text x="777" y="505" text-anchor="middle" class="label">V before reshape</text><text x="777" y="535" text-anchor="middle" class="mono">[1, 512, 256]</text>
  </g>
  <path d="M880 255 L955 255" class="arrow"/><path d="M880 390 L955 390" class="arrow"/><path d="M880 520 L955 520" class="arrow"/>

  <!-- 4D Q stack -->
  <g>
    <g opacity=".35"><rect x="1000" y="185" width="300" height="100" fill="#6d28d9" stroke="#c4b5fd"/><rect x="990" y="195" width="300" height="100" fill="#6d28d9" stroke="#c4b5fd"/><rect x="980" y="205" width="300" height="100" fill="#6d28d9" stroke="#c4b5fd"/></g>
    <rect x="970" y="215" width="300" height="100" fill="url(#qFront)" stroke="#ddd6fe"/>
    <text x="1120" y="245" text-anchor="middle" class="label">Q: 12 head slabs</text><text x="1120" y="273" text-anchor="middle" class="mono">[1, 12, 512, 128]</text><text x="1120" y="298" text-anchor="middle" class="small">each slab is [T=512, Dh=128]</text>
    <line x1="970" y1="330" x2="1270" y2="330" class="axis"/><text x="1120" y="351" text-anchor="middle" class="dim">Dh = 128</text>
    <line x1="950" y1="315" x2="950" y2="215" class="axis"/><text x="935" y="265" transform="rotate(-90 935 265)" text-anchor="middle" class="dim">T = 512</text>
    <line x1="1280" y1="205" x2="1310" y2="175" class="axis"/><text x="1320" y="178" class="dim">Hq = 12</text>
  </g>

  <!-- K and V 4D stacks -->
  <g>
    <rect x="980" y="372" width="300" height="80" fill="#155e75" stroke="#67e8f9"/><rect x="970" y="382" width="300" height="80" fill="url(#kFront)" stroke="#cffafe"/>
    <text x="1120" y="411" text-anchor="middle" class="label">K: 2 head slabs</text><text x="1120" y="441" text-anchor="middle" class="mono">[1, 2, 512, 128]</text>
    <line x1="1280" y1="372" x2="1310" y2="342" class="axis"/><text x="1320" y="345" class="dim">Hkv = 2</text>
    <rect x="980" y="502" width="300" height="80" fill="#065f46" stroke="#6ee7b7"/><rect x="970" y="512" width="300" height="80" fill="url(#vFront)" stroke="#d1fae5"/>
    <text x="1120" y="541" text-anchor="middle" class="label">V: 2 head slabs</text><text x="1120" y="571" text-anchor="middle" class="mono">[1, 2, 512, 128]</text>
  </g>
  <rect x="1360" y="200" width="160" height="390" rx="12" class="note"/>
  <text x="1440" y="232" text-anchor="middle" class="label">4-D reading order</text>
  <text x="1380" y="270" class="monoSm">B = 1</text><text x="1380" y="294" class="small">outer batch</text>
  <text x="1380" y="332" class="monoSm">Hq = 12</text><text x="1380" y="356" class="small">Q head slabs</text>
  <text x="1380" y="394" class="monoSm">Hkv = 2</text><text x="1380" y="418" class="small">K/V head slabs</text>
  <text x="1380" y="456" class="monoSm">T = 512</text><text x="1380" y="480" class="small">rows: positions</text>
  <text x="1380" y="518" class="monoSm">Dh = 128</text><text x="1380" y="542" class="small">columns: vector</text>
  <text x="1380" y="575" class="small">B is a one-item outer</text><text x="1380" y="594" class="small">stack in this experiment.</text>

  <!-- Panel B GQA -->
  <rect x="40" y="700" width="1520" height="390" rx="20" class="panel"/>
  <text x="70" y="738" class="panelTitle">B  Grouped-query attention: 6 query heads share each KV head</text>
  <text x="70" y="767" class="body">Logical shapes are shown. A fused attention kernel may avoid materializing the full score tensor in VRAM.</text>

  <!-- group 1 -->
  <g>
    <rect x="90" y="810" width="285" height="105" rx="10" fill="#3b1d75" stroke="#a78bfa"/>
    <text x="232" y="838" text-anchor="middle" class="label">Query group 1</text><text x="232" y="865" text-anchor="middle" class="monoSm">Q heads 0–5</text><text x="232" y="891" text-anchor="middle" class="monoSm">6 × [512, 128]</text>
    <rect x="90" y="945" width="285" height="105" rx="10" fill="#3b1d75" stroke="#a78bfa"/>
    <text x="232" y="973" text-anchor="middle" class="label">Query group 2</text><text x="232" y="1000" text-anchor="middle" class="monoSm">Q heads 6–11</text><text x="232" y="1026" text-anchor="middle" class="monoSm">6 × [512, 128]</text>
  </g>
  <path d="M375 862 L450 862" class="arrow"/><path d="M375 997 L450 997" class="arrow"/>
  <g>
    <rect x="460" y="810" width="230" height="105" rx="10" fill="#164e63" stroke="#67e8f9"/><text x="575" y="840" text-anchor="middle" class="label">Shared K head 0</text><text x="575" y="870" text-anchor="middle" class="mono">[512, 128]</text><text x="575" y="895" text-anchor="middle" class="small">transposed logically</text>
    <rect x="460" y="945" width="230" height="105" rx="10" fill="#164e63" stroke="#67e8f9"/><text x="575" y="975" text-anchor="middle" class="label">Shared K head 1</text><text x="575" y="1005" text-anchor="middle" class="mono">[512, 128]</text><text x="575" y="1030" text-anchor="middle" class="small">transposed logically</text>
  </g>
  <path d="M690 862 L765 862" class="arrow"/><path d="M690 997 L765 997" class="arrow"/>
  <text x="728" y="840" text-anchor="middle" class="monoSm">Q × Kᵀ</text>
  <g>
    <rect x="775" y="810" width="300" height="240" rx="10" fill="url(#sFront)" stroke="#fda4af"/>
    <path d="M825 810 V1050 M875 810 V1050 M925 810 V1050 M975 810 V1050 M1025 810 V1050" stroke="#fecdd3" stroke-opacity=".35"/>
    <path d="M775 850 H1075 M775 890 H1075 M775 930 H1075 M775 970 H1075 M775 1010 H1075" stroke="#fecdd3" stroke-opacity=".22"/>
    <text x="925" y="852" text-anchor="middle" class="label">Logical attention scores S</text><text x="925" y="885" text-anchor="middle" class="mono">[1, 12, 512, 512]</text>
    <text x="925" y="918" text-anchor="middle" class="small">per Q head:</text><text x="925" y="943" text-anchor="middle" class="monoSm">[query positions, key positions]</text>
    <text x="925" y="1005" text-anchor="middle" class="small">softmax along key positions</text><text x="925" y="1030" text-anchor="middle" class="monoSm">P has the same logical shape</text>
  </g>
  <path d="M1075 930 L1150 930" class="arrow"/>
  <g>
    <rect x="1160" y="810" width="340" height="240" rx="10" fill="#064e3b" stroke="#6ee7b7"/>
    <text x="1330" y="850" text-anchor="middle" class="label">P × shared V heads</text>
    <text x="1330" y="883" text-anchor="middle" class="monoSm">P [1, 12, 512, 512]</text>
    <text x="1330" y="910" text-anchor="middle" class="monoSm">V [1, 2, 512, 128]</text>
    <text x="1330" y="947" text-anchor="middle" class="body">V head 0 serves Q heads 0–5</text><text x="1330" y="973" text-anchor="middle" class="body">V head 1 serves Q heads 6–11</text>
    <text x="1330" y="1010" text-anchor="middle" class="label">Attention output by head</text><text x="1330" y="1037" text-anchor="middle" class="mono">[1, 12, 512, 128]</text>
  </g>

  <!-- Panel C cache hierarchy -->
  <rect x="40" y="1115" width="740" height="575" rx="20" class="panel"/>
  <text x="70" y="1153" class="panelTitle">C  KV cache hierarchy in VRAM</text>
  <text x="70" y="1181" class="body">Every layer owns a K tensor and a V tensor; Q is not stored.</text>
  <g>
    <rect x="95" y="1230" width="455" height="125" rx="8" fill="#164e63" stroke="#67e8f9"/><polygon points="95,1230 120,1210 575,1210 550,1230" fill="#0e7490"/><polygon points="550,1230 575,1210 575,1335 550,1355" fill="#083344"/>
    <text x="322" y="1265" text-anchor="middle" class="label">Layer ℓ — Key cache Kℓ</text><text x="322" y="1296" text-anchor="middle" class="mono">[1, 2, 512, 128]</text><text x="322" y="1327" text-anchor="middle" class="small">2 heads × 512 position rows × 128-value vectors</text>
    <rect x="95" y="1390" width="455" height="125" rx="8" fill="#064e3b" stroke="#6ee7b7"/><polygon points="95,1390 120,1370 575,1370 550,1390" fill="#059669"/><polygon points="550,1390 575,1370 575,1495 550,1515" fill="#022c22"/>
    <text x="322" y="1425" text-anchor="middle" class="label">Layer ℓ — Value cache Vℓ</text><text x="322" y="1456" text-anchor="middle" class="mono">[1, 2, 512, 128]</text><text x="322" y="1487" text-anchor="middle" class="small">same axes and allocation size as Kℓ</text>
  </g>
  <path d="M590 1260 C650 1260 650 1450 590 1450" class="dash"/>
  <text x="620" y="1320" class="mono">256 KiB</text><text x="620" y="1344" class="small">per K or V</text><text x="620" y="1378" class="mono">512 KiB</text><text x="620" y="1402" class="small">per K+V pair</text>
  <rect x="95" y="1550" width="625" height="100" rx="10" class="note"/>
  <text x="407" y="1580" text-anchor="middle" class="label">28 layers × 2 tensors = 56 cached tensors</text>
  <text x="407" y="1610" text-anchor="middle" class="mono">28 × 512 KiB = 14 MiB at T = 512</text>
  <text x="407" y="1636" text-anchor="middle" class="small">One new cached position across all layers adds 28 KiB.</text>

  <!-- Panel D decode -->
  <rect x="805" y="1115" width="755" height="575" rx="20" class="panel"/>
  <text x="835" y="1153" class="panelTitle">D  Decode: vectors enter; the cache grows along T</text>
  <text x="835" y="1181" class="body">At each step, one token produces one vector per head rather than 512 position rows.</text>
  <g>
    <rect x="850" y="1220" width="185" height="85" rx="9" fill="url(#xFront)" stroke="#94a3b8"/><text x="942" y="1250" text-anchor="middle" class="label">Xₜ</text><text x="942" y="1280" text-anchor="middle" class="mono">[1, 1, 1536]</text>
    <path d="M1035 1262 L1090 1262" class="arrow"/>
    <rect x="1100" y="1200" width="195" height="68" rx="8" fill="#4c1d95" stroke="#a78bfa"/><text x="1197" y="1225" text-anchor="middle" class="label">qₜ vectors</text><text x="1197" y="1250" text-anchor="middle" class="monoSm">[1, 12, 1, 128]</text>
    <rect x="1100" y="1280" width="195" height="68" rx="8" fill="#164e63" stroke="#67e8f9"/><text x="1197" y="1305" text-anchor="middle" class="label">kₜ vectors</text><text x="1197" y="1330" text-anchor="middle" class="monoSm">[1, 2, 1, 128]</text>
    <rect x="1100" y="1360" width="195" height="68" rx="8" fill="#064e3b" stroke="#6ee7b7"/><text x="1197" y="1385" text-anchor="middle" class="label">vₜ vectors</text><text x="1197" y="1410" text-anchor="middle" class="monoSm">[1, 2, 1, 128]</text>
  </g>
  <path d="M1295 1314 L1350 1314" class="arrow"/>
  <g>
    <polygon points="1360,1220 1380,1205 1515,1205 1495,1220" fill="#0e7490"/><polygon points="1495,1220 1515,1205 1515,1460 1495,1475" fill="#083344"/>
    <rect x="1360" y="1220" width="135" height="255" fill="#164e63" stroke="#67e8f9"/>
    <rect x="1360" y="1460" width="135" height="15" fill="#22d3ee"/>
    <text x="1427" y="1252" text-anchor="middle" class="label">K cache</text><text x="1427" y="1280" text-anchor="middle" class="monoSm">old T rows</text>
    <text x="1427" y="1447" text-anchor="middle" class="small">append kₜ</text>
  </g>
  <rect x="850" y="1485" width="655" height="155" rx="10" class="note"/>
  <text x="1177" y="1518" text-anchor="middle" class="label">Shape transition in every layer</text>
  <text x="1177" y="1550" text-anchor="middle" class="mono">K,V: [1, 2, 512, 128] + [1, 2, 1, 128]</text>
  <text x="1177" y="1580" text-anchor="middle" class="mono">→ [1, 2, 513, 128] → ... → [1, 2, T, 128]</text>
  <text x="1177" y="1608" text-anchor="middle" class="body">Logical decode scores per Q head:</text>
  <text x="1177" y="1631" text-anchor="middle" class="monoSm">[1 query position, T cached key positions]</text>

  <text x="55" y="1730" class="small">Not drawn to scale. Matrix orientations follow PyTorch Linear weight storage [out_features, in_features]. Attention-score shapes are logical; fused kernels can tile them without a full VRAM allocation.</text>
</svg>
