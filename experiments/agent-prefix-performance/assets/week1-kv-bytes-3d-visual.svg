<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">How the KV-cache bytes equation maps to tensor dimensions</title>
  <desc id="desc">A three-dimensional tensor diagram showing a key and value cache for every layer, KV head, token position, and head dimension, followed by a worked byte calculation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#102b43"/></linearGradient>
    <linearGradient id="front" x2="0" y2="1"><stop stop-color="#1e4264"/><stop offset="1" stop-color="#12263f"/></linearGradient>
    <linearGradient id="top" x2="1" y2="1"><stop stop-color="#4b86b5"/><stop offset="1" stop-color="#275579"/></linearGradient>
    <linearGradient id="side" x2="1" y2="1"><stop stop-color="#102238"/><stop offset="1" stop-color="#071321"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".42"/></filter>
    <style>
      .title{font:700 34px Inter,system-ui,sans-serif;fill:#f8fafc}.sub{font:500 18px Inter,system-ui,sans-serif;fill:#bfdbfe}
      .h{font:700 21px Inter,system-ui,sans-serif;fill:#f8fafc}.body{font:500 16px Inter,system-ui,sans-serif;fill:#dbeafe}
      .mono{font:700 19px 'SFMono-Regular',Menlo,monospace;fill:#f8fafc}.small{font:500 14px Inter,system-ui,sans-serif;fill:#cbd5e1}
      .tiny{font:600 13px Inter,system-ui,sans-serif;fill:#cbd5e1}.panel{fill:#0e1d31;stroke:#35516d;stroke-width:2}
      .line{stroke:#7dd3fc;stroke-width:3;fill:none;stroke-linecap:round}.dash{stroke:#9fb8cf;stroke-width:2;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="url(#bg)"/>
  <text x="60" y="62" class="title">KV-cache bytes: from tensor axes to VRAM</text>
  <text x="60" y="96" class="sub">Every stored scalar is identified by batch, layer, KV head, token position, and head dimension.</text>
  <rect x="50" y="130" width="1500" height="142" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="82" y="170" class="h">The equation</text>
  <text x="82" y="218" class="mono">KV bytes = 2 × B × L × Hₖᵥ × T × D × bytes/element</text>
  <text x="82" y="250" class="small">2 = K and V. The remaining factors count how many FP16 scalars are stored.</text>

  <rect x="50" y="302" width="820" height="690" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="82" y="346" class="h">What one layer stores</text>
  <text x="82" y="374" class="small">For one request, one layer contains two tensors with shape [Hₖᵥ, T, D].</text>
  <g transform="translate(155 470)" filter="url(#shadow)">
    <g opacity=".38" transform="translate(90 -105)"><polygon points="0,0 390,0 470,45 80,45" fill="url(#top)"/><polygon points="390,0 470,45 470,220 390,175" fill="url(#side)"/><polygon points="80,45 470,45 470,220 80,220" fill="#19314d"/></g>
    <g opacity=".55" transform="translate(55 -55)"><polygon points="0,0 390,0 470,45 80,45" fill="url(#top)"/><polygon points="390,0 470,45 470,220 390,175" fill="url(#side)"/><polygon points="80,45 470,45 470,220 80,220" fill="#1b3856"/></g>
    <text x="335" y="-22" class="tiny">… repeated for L = 28 layers …</text>
    <polygon points="0,0 390,0 470,45 80,45" fill="url(#top)"/><polygon points="390,0 470,45 470,220 390,175" fill="url(#side)"/><polygon points="0,0 80,45 80,220 0,175" fill="#17304b"/><polygon points="80,45 470,45 470,220 80,220" fill="url(#front)"/>
    <rect x="105" y="72" width="170" height="125" rx="8" fill="#20b9a5" opacity=".9"/><rect x="295" y="72" width="150" height="125" rx="8" fill="#8b6be8" opacity=".92"/>
    <text x="190" y="114" text-anchor="middle" class="h">K</text><text x="190" y="141" text-anchor="middle" class="tiny">[Hₖᵥ, T, D]</text><text x="370" y="114" text-anchor="middle" class="h">V</text><text x="370" y="141" text-anchor="middle" class="tiny">[Hₖᵥ, T, D]</text><text x="275" y="190" text-anchor="middle" class="tiny">one layer = K + V</text>
  </g>
  <path d="M235 690 L235 785 L155 785" class="line"/><text x="82" y="811" class="mono">Hₖᵥ = 2</text><text x="82" y="835" class="small">two KV-head lanes</text>
  <path d="M430 690 L430 880 L335 880" class="line"/><text x="262" y="906" class="mono">T = 512</text><text x="262" y="930" class="small">cached token positions</text>
  <path d="M600 650 L760 650 L760 600" class="line"/><text x="625" y="570" class="mono">D = 128</text><text x="625" y="594" class="small">values per head vector</text>
  <path d="M630 465 L785 420" class="line"/><text x="610" y="404" class="mono">L = 28</text><text x="610" y="428" class="small">layer slabs in depth</text>

  <rect x="910" y="302" width="640" height="690" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="944" y="346" class="h">Count the scalars, then the bytes</text>
  <text x="944" y="390" class="small">Step 1 — one layer, one request</text>
  <text x="944" y="425" class="mono">K: 2 × 512 × 128 = 131,072 values</text><text x="944" y="458" class="mono">V: 2 × 512 × 128 = 131,072 values</text><text x="944" y="491" class="mono">K + V = 262,144 values</text>
  <path d="M944 520 H1510" class="dash"/>
  <text x="944" y="560" class="small">Step 2 — repeat for all 28 layers</text><text x="944" y="598" class="mono">262,144 × 28 = 7,340,032 values</text>
  <text x="944" y="631" class="small">Step 3 — FP16 stores 2 bytes per value</text><text x="944" y="669" class="mono">7,340,032 × 2 = 14,680,064 bytes</text>
  <rect x="944" y="710" width="540" height="104" rx="16" fill="#123b52" stroke="#38bdf8" stroke-width="2"/><text x="974" y="751" class="h">512-token prompt</text><text x="974" y="786" class="mono">14,680,064 bytes = 14 MiB</text>
  <text x="944" y="864" class="small">If T grows from 512 to 2048 (4×):</text><text x="944" y="901" class="mono">14 MiB × 4 = 56 MiB</text><text x="944" y="937" class="tiny">Logical cache storage; allocator peaks also include weights and temporary tensors.</text>
</svg>
