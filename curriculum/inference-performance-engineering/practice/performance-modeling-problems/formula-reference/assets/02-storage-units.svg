<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Tensor values, parameter count, storage, and units</title><desc id="desc">The card shows how to multiply tensor dimensions for value count, multiply by bytes per value for storage, and convert bytes to decimal MB or binary MiB.</desc>
  <defs><style>.bg{fill:#09121f}.p{fill:#111f33;stroke:#3d5b7b;stroke-width:2}.one{fill:#173a56;stroke:#58a6d8;stroke-width:3}.two{fill:#322342;stroke:#b58bdd;stroke-width:3}.three{fill:#4b301b;stroke:#f2a65a;stroke-width:3}.h{fill:#f3f7fc;font:700 28px system-ui,sans-serif}.t{fill:#f3f7fc;font:700 21px system-ui,sans-serif}.s{fill:#afc2d6;font:16px system-ui,sans-serif}.m{fill:#f3f7fc;font:italic 27px Georgia,serif}.blue{fill:#76bee9}.purple{fill:#c9a0ed}.orange{fill:#ffc078}.yellow{fill:#ffd166}.arrow{stroke:#8fafd0;stroke-width:3;fill:none}</style></defs>
  <rect class="bg" width="1400" height="560" rx="20"/><text class="h" x="40" y="48">STORAGE — count values first, then attach bytes</text>
  <rect class="one" x="55" y="95" width="390" height="180" rx="15"/><text class="t blue" x="80" y="135">1 · Count scalar values</text><text class="m" x="80" y="190">values = D₀ × D₁ × … × Dₙ</text><text class="s" x="80" y="235">A [K × N] weight matrix has K × N parameters.</text>
  <rect class="two" x="505" y="95" width="390" height="180" rx="15"/><text class="t purple" x="530" y="135">2 · Apply representation</text><text class="m" x="530" y="190">bytes = values × bytes/value</text><text class="s" x="530" y="235">FP32: 4 · FP16/BF16: 2 · FP8/INT8: 1</text>
  <rect class="three" x="955" y="95" width="390" height="180" rx="15"/><text class="t orange" x="980" y="135">3 · Convert units explicitly</text><text class="m" x="980" y="190">MB = bytes / 10⁶</text><text class="m" x="980" y="235">MiB = bytes / 2²⁰</text>
  <rect class="p" x="55" y="330" width="610" height="160" rx="15"/><text class="t yellow" x="80" y="370">Example: W [4096 × 4096], FP16</text><text class="m" x="80" y="415">16,777,216 values × 2 bytes/value</text><text class="m orange" x="80" y="462">= 33,554,432 bytes</text>
  <rect class="p" x="735" y="330" width="610" height="160" rx="15"/><text class="t yellow" x="760" y="370">Same bytes, two reporting units</text><text class="m" x="760" y="415">33,554,432 bytes = 33.55 MB</text><text class="m" x="760" y="462">33,554,432 bytes = 32 MiB</text>
  <text class="s" x="55" y="535">Parameters are a count. Bytes are storage. MB and MiB are different unit conventions—not different data.</text>
</svg>
