<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Arithmetic intensity and roofline latency formulas</title><desc id="desc">The card derives arithmetic intensity, hardware ridge point, compute time, memory time, and the maximum lower-bound rule, with memory-bound and compute-bound classifications.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#90b0cf"/></marker><style>.bg{fill:#09121f}.p{fill:#111f33;stroke:#3d5b7b;stroke-width:2}.ai{fill:#173a56;stroke:#58a6d8;stroke-width:3}.mem{fill:#4b301b;stroke:#f2a65a;stroke-width:3}.comp{fill:#123c32;stroke:#56d3a3;stroke-width:3}.final{fill:#322342;stroke:#b58bdd;stroke-width:3}.h{fill:#f3f7fc;font:700 28px system-ui,sans-serif}.t{fill:#f3f7fc;font:700 20px system-ui,sans-serif}.s{fill:#afc2d6;font:15px system-ui,sans-serif}.m{fill:#f3f7fc;font:italic 25px Georgia,serif}.blue{fill:#76bee9}.orange{fill:#ffc078}.green{fill:#78dfb5}.purple{fill:#c9a0ed}.yellow{fill:#ffd166}.arrow{stroke:#90b0cf;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1400" height="650" rx="20"/><text class="h" x="40" y="48">ROOFLINE-STYLE MODEL — compare work per byte with hardware balance</text>
  <rect class="ai" x="55" y="90" width="600" height="145" rx="15"/><text class="t blue" x="80" y="130">Operation arithmetic intensity</text><text class="m" x="80" y="185">AI = operation FLOPs / operation bytes</text><text class="s" x="80" y="215">unit: FLOPs/byte</text>
  <rect class="ai" x="745" y="90" width="600" height="145" rx="15"/><text class="t blue" x="770" y="130">Hardware ridge point</text><text class="m" x="770" y="185">ridge = peak FLOPs/s ÷ peak bytes/s</text><text class="s" x="770" y="215">unit: FLOPs/byte</text>
  <path class="arrow" d="M350 235 V280 H300"/><path class="arrow" d="M1050 235 V280 H1100"/>
  <rect class="mem" x="55" y="290" width="600" height="145" rx="15"/><text class="t orange" x="80" y="330">Memory-time lower bound</text><text class="m" x="80" y="385">Tₘₑₘ = bytes / bandwidth</text><text class="s" x="80" y="415">bytes ÷ (bytes/second) = seconds</text>
  <rect class="comp" x="745" y="290" width="600" height="145" rx="15"/><text class="t green" x="770" y="330">Compute-time lower bound</text><text class="m" x="770" y="385">T꜀ₒₘₚ = FLOPs / compute rate</text><text class="s" x="770" y="415">FLOPs ÷ (FLOPs/second) = seconds</text>
  <path class="arrow" d="M350 435 V485 H570"/><path class="arrow" d="M1050 435 V485 H830"/>
  <rect class="final" x="330" y="495" width="740" height="105" rx="15"/><text class="t purple" x="355" y="535">Idealized roofline lower bound</text><text class="m" x="355" y="578">Tₘᵢₙ = max(Tₘₑₘ, T꜀ₒₘₚ)</text>
  <text class="s orange" x="80" y="630">AI &lt; ridge → memory-bound</text><text class="s green" x="1065" y="630">AI &gt; ridge → compute-bound</text><text class="s yellow" x="560" y="630">Use achieved rates for calibrated predictions.</text>
</svg>
