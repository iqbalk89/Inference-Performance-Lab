<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Matrix shapes and compute formulas</title><desc id="desc">Two compatible matrices M by K and K by N produce an M by N output. The card derives output elements, MACs, and approximate FLOPs.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#8fafd0"/></marker><style>.bg{fill:#09121f}.p{fill:#111f33;stroke:#3d5b7b;stroke-width:2}.a{fill:#173a56;stroke:#58a6d8;stroke-width:3}.b{fill:#322342;stroke:#b58bdd;stroke-width:3}.c{fill:#123c32;stroke:#56d3a3;stroke-width:3}.h{fill:#f3f7fc;font:700 28px system-ui,sans-serif}.t{fill:#f3f7fc;font:700 21px system-ui,sans-serif}.s{fill:#afc2d6;font:16px system-ui,sans-serif}.m{fill:#f3f7fc;font:italic 28px Georgia,serif}.blue{fill:#76bee9}.purple{fill:#c9a0ed}.green{fill:#78dfb5}.yellow{fill:#ffd166}.arrow{stroke:#8fafd0;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1400" height="560" rx="20"/><text class="h" x="40" y="48">MATRIX MULTIPLICATION — shapes determine work</text>
  <rect class="a" x="75" y="105" width="260" height="155" rx="14"/><text class="m" x="166" y="153">A</text><text class="m blue" x="126" y="211">[M × K]</text>
  <text class="m" x="370" y="198">×</text>
  <rect class="b" x="420" y="85" width="290" height="195" rx="14"/><text class="m" x="530" y="143">B</text><text class="m purple" x="473" y="215">[K × N]</text>
  <text class="m" x="750" y="198">=</text>
  <rect class="c" x="800" y="105" width="260" height="155" rx="14"/><text class="m" x="894" y="153">C</text><text class="m green" x="851" y="211">[M × N]</text>
  <rect class="p" x="1090" y="85" width="255" height="195" rx="14"/><text class="t yellow" x="1115" y="125">Compatibility</text><text class="s" x="1115" y="160">inner K dimensions</text><text class="s" x="1115" y="188">must match</text><text class="m yellow" x="1145" y="242">K = K</text>
  <path class="arrow" d="M335 298 C430 345 540 345 565 280"/><text class="s yellow" x="365" y="365">one row of A · one column of B → one dot product</text>
  <rect class="p" x="55" y="405" width="390" height="105" rx="13"/><text class="t" x="80" y="440">Output values</text><text class="m green" x="80" y="486">M × N</text>
  <rect class="p" x="505" y="405" width="390" height="105" rx="13"/><text class="t" x="530" y="440">Multiply-accumulates</text><text class="m purple" x="530" y="486">M × K × N MACs</text>
  <rect class="p" x="955" y="405" width="390" height="105" rx="13"/><text class="t" x="980" y="440">Conventional compute</text><text class="m yellow" x="980" y="486">FLOPs ≈ 2MKN</text>
</svg>
