<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Prefill attention: all prompt rows processed together</title>
  <desc id="desc">A visual walkthrough of query, key, value projections, causal score matrix, softmax, and value mixing for a four-token prompt with two attention heads.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111b2d"/></linearGradient>
    <linearGradient id="q" x2="1" y2="1"><stop stop-color="#263f7a"/><stop offset="1" stop-color="#3564bb"/></linearGradient>
    <linearGradient id="k" x2="1" y2="1"><stop stop-color="#5c3d19"/><stop offset="1" stop-color="#a77327"/></linearGradient>
    <linearGradient id="v" x2="1" y2="1"><stop stop-color="#135b5e"/><stop offset="1" stop-color="#16a6a1"/></linearGradient>
    <linearGradient id="p" x2="1" y2="1"><stop stop-color="#512b70"/><stop offset="1" stop-color="#9b55c7"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a9bfdc"/></marker>
    <style>
      .bg{fill:url(#bg)} .panel{fill:#142138;stroke:#2d4566;stroke-width:2;rx:14} .box{stroke:#b8cee7;stroke-width:1.5;rx:10;filter:url(#shadow)}
      .t{font-family:Inter,Arial,sans-serif;fill:#ecf4ff}.muted{font-family:Inter,Arial,sans-serif;fill:#b4c4d9}.small{font-size:18px}.med{font-size:23px}.big{font-size:34px;font-weight:700}.label{font-size:21px;font-weight:700}
      .line{stroke:#a9bfdc;stroke-width:3;fill:none;marker-end:url(#arrow)} .thin{stroke:#6f88a8;stroke-width:2;fill:none;stroke-dasharray:7 7}
      .cell{stroke:#dce9ff;stroke-width:1.5}.qcell{fill:#3c70ca}.kcell{fill:#bc832d}.vcell{fill:#19aaa1}.pcell{fill:#975bc2}.masked{fill:#354255}.active{fill:#e6b94c}
    </style>
  </defs>
  <rect class="bg" width="1600" height="980"/>
  <text x="60" y="62" class="t big">Prefill attention — every known prompt token gets a query</text>
  <text x="60" y="96" class="muted med">Example: one sequence, T = 4 prompt tokens, h = 2 heads, d_head = 3</text>
  <rect x="50" y="125" width="1500" height="155" class="panel"/>
  <text x="75" y="160" class="t label">1. Input hidden states X</text>
  <text x="75" y="190" class="muted small">Rows are token positions. Each row is the model’s current numerical representation of one token.</text>
  <text x="75" y="225" class="muted small">Shape: X = [T, d_model] = [4, 6]  →  four rows enter the same layer together.</text>
  <g transform="translate(820 153)"><text x="0" y="-10" class="muted small">rows = positions</text>
    <text x="0" y="26" class="t small">Cats</text><text x="0" y="59" class="t small">chase</text><text x="0" y="92" class="t small">small</text><text x="0" y="125" class="t small">mice</text>
    <rect x="70" y="0" width="330" height="132" fill="#213655" stroke="#7e9bc2"/>
    <g class="cell qcell"><rect x="70" y="0" width="55" height="33"/><rect x="125" y="0" width="55" height="33"/><rect x="180" y="0" width="55" height="33"/><rect x="235" y="0" width="55" height="33"/><rect x="290" y="0" width="55" height="33"/><rect x="345" y="0" width="55" height="33"/>
    <rect x="70" y="33" width="330" height="33"/><rect x="70" y="66" width="330" height="33"/><rect x="70" y="99" width="330" height="33"/></g>
    <text x="416" y="78" class="muted small">[4 × 6]</text>
  </g>
  <path d="M800 280 V320" class="line"/>
  <rect x="50" y="330" width="1500" height="205" class="panel"/>
  <text x="75" y="365" class="t label">2. Three learned projections create Q, K, and V</text>
  <text x="75" y="395" class="muted small">The same X rows are multiplied by three different weight matrices: Q = XW_Q, K = XW_K, V = XW_V.</text>
  <text x="75" y="425" class="muted small">Each token position produces one row in each matrix. Split each row into two heads of width 3.</text>
  <g transform="translate(110 452)"><rect width="170" height="60" fill="url(#q)" class="box"/><text x="60" y="38" class="t med">Q [4×6]</text><text x="195" y="38" class="t big">→</text><rect x="255" width="170" height="60" fill="url(#k)" class="box"/><text x="312" y="38" class="t med">K [4×6]</text><text x="450" y="38" class="t big">→</text><rect x="510" width="170" height="60" fill="url(#v)" class="box"/><text x="565" y="38" class="t med">V [4×6]</text></g>
  <text x="930" y="468" class="muted small">For each head: Q_h, K_h, V_h have shape [4, 3].</text>
  <text x="930" y="500" class="muted small">Head 0 uses columns 0–2; head 1 uses columns 3–5.</text>
  <path d="M800 535 V575" class="line"/>
  <rect x="50" y="585" width="1500" height="300" class="panel"/>
  <text x="75" y="620" class="t label">3. Scores, causal mask, softmax, then mix V</text>
  <text x="75" y="650" class="muted small">For head 0, each query row compares with every key row: S = QKᵀ / √d_head, shape [4×4].</text>
  <text x="75" y="677" class="muted small">Row i asks: “How relevant is each position j to token i?” Future positions are forbidden before softmax.</text>
  <g transform="translate(95 710)"><text x="0" y="-15" class="muted small">score / probability matrix (rows = query position, columns = key position)</text>
    <text x="100" y="15" class="muted small">Cats</text><text x="165" y="15" class="muted small">chase</text><text x="235" y="15" class="muted small">small</text><text x="305" y="15" class="muted small">mice</text>
    <text x="20" y="52" class="t small">Cats</text><text x="20" y="87" class="t small">chase</text><text x="20" y="122" class="t small">small</text><text x="20" y="157" class="t small">mice</text>
    <g><rect x="90" y="25" width="280" height="140" fill="#203552" stroke="#86a7d0"/>
      <g class="cell pcell"><rect x="90" y="25" width="70" height="35"/><rect x="90" y="60" width="70" height="35"/><rect x="160" y="60" width="70" height="35"/><rect x="90" y="95" width="70" height="35"/><rect x="160" y="95" width="70" height="35"/><rect x="230" y="95" width="70" height="35"/><rect x="90" y="130" width="70" height="35"/><rect x="160" y="130" width="70" height="35"/><rect x="230" y="130" width="70" height="35"/><rect x="300" y="130" width="70" height="35"/></g>
      <g class="cell masked"><rect x="160" y="25" width="70" height="35"/><rect x="230" y="25" width="70" height="35"/><rect x="300" y="25" width="70" height="35"/><rect x="230" y="60" width="70" height="35"/><rect x="300" y="60" width="70" height="35"/><rect x="300" y="95" width="70" height="35"/></g>
    </g><text x="405" y="88" class="muted small">upper triangle = −∞ mask</text><text x="405" y="116" class="muted small">softmax turns each allowed</text><text x="405" y="141" class="muted small">row into probabilities</text>
  </g>
  <path d="M700 760 H800" class="line"/><rect x="820" y="715" width="235" height="90" fill="url(#p)" class="box"/><text x="870" y="752" class="t med">P = softmax(S)</text><text x="855" y="781" class="muted small">[4×4], rows sum to 1</text>
  <path d="M1055 760 H1145" class="line"/><rect x="1165" y="700" width="300" height="120" fill="url(#v)" class="box"/><text x="1218" y="742" class="t med">O = P V</text><text x="1200" y="774" class="muted small">[4×4] × [4×3] → [4×3]</text><text x="1200" y="800" class="muted small">weighted mixture of values</text>
  <text x="75" y="925" class="t med">Important: all four query rows are computed in one batched operation, but the mask still prevents future-token information from entering earlier rows.</text>
</svg>
