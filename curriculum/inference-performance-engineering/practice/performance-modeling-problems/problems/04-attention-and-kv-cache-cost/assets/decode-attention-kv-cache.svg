<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Decode attention: one new query reads the KV cache</title>
  <desc id="desc">A visual walkthrough of decode attention for one newly generated token, showing the new Q K V rows, the existing key and value cache, attention scores, weighted value mix, and cache append.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111b2d"/></linearGradient>
    <linearGradient id="q" x2="1" y2="1"><stop stop-color="#263f7a"/><stop offset="1" stop-color="#3564bb"/></linearGradient>
    <linearGradient id="k" x2="1" y2="1"><stop stop-color="#5c3d19"/><stop offset="1" stop-color="#a77327"/></linearGradient>
    <linearGradient id="v" x2="1" y2="1"><stop stop-color="#135b5e"/><stop offset="1" stop-color="#16a6a1"/></linearGradient>
    <linearGradient id="p" x2="1" y2="1"><stop stop-color="#512b70"/><stop offset="1" stop-color="#9b55c7"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a9bfdc"/></marker>
    <style>
      .bg{fill:url(#bg)} .panel{fill:#142138;stroke:#2d4566;stroke-width:2;rx:14} .box{stroke:#b8cee7;stroke-width:1.5;rx:10;filter:url(#shadow)}
      .t{font-family:Inter,Arial,sans-serif;fill:#ecf4ff}.muted{font-family:Inter,Arial,sans-serif;fill:#b4c4d9}.small{font-size:18px}.med{font-size:23px}.big{font-size:34px;font-weight:700}.label{font-size:21px;font-weight:700}
      .line{stroke:#a9bfdc;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#8aa3c3;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .cell{stroke:#dce9ff;stroke-width:1.5}.qcell{fill:#3c70ca}.kcell{fill:#bc832d}.vcell{fill:#19aaa1}.pcell{fill:#975bc2}.old{fill:#55657b}.new{fill:#e6b94c}
    </style>
  </defs>
  <rect class="bg" width="1700" height="980"/>
  <text x="60" y="62" class="t big">Decode attention — one new token reads all earlier K/V rows</text>
  <text x="60" y="96" class="muted med">Example: 4 cached prompt tokens + 1 new token, h = 2 heads, d_head = 3</text>
  <rect x="50" y="125" width="1600" height="185" class="panel"/>
  <text x="75" y="160" class="t label">1. Decode starts with one new hidden-state row</text>
  <text x="75" y="192" class="muted small">The prompt’s K/V rows already exist in GPU memory. The newly generated position produces only one new row.</text>
  <text x="75" y="222" class="muted small">New hidden state: x_new [1×6]  →  q_new, k_new, v_new [1×6]  →  per-head rows [1×3].</text>
  <g transform="translate(860 153)"><text x="0" y="-10" class="muted small">new position (mice)</text><rect x="0" y="5" width="330" height="48" fill="url(#q)" class="box"/><text x="110" y="37" class="t med">x_new [1×6]</text><path d="M350 30 H415" class="line"/><rect x="435" y="5" width="150" height="48" fill="url(#q)" class="box"/><text x="484" y="37" class="t med">q [1×6]</text></g>
  <path d="M800 310 V350" class="line"/>
  <rect x="50" y="360" width="1600" height="275" class="panel"/>
  <text x="75" y="397" class="t label">2. New K/V rows append to the cache; old rows stay resident</text>
  <text x="75" y="428" class="muted small">For each head, the cache grows from [4, 3] to [5, 3]. The query is still only [1, 3].</text>
  <g transform="translate(100 472)"><text x="0" y="-14" class="muted small">K cache, head 0</text><rect x="0" y="0" width="430" height="92" fill="#26364d" stroke="#88a6c8"/>
    <g class="cell kcell"><rect x="0" y="0" width="86" height="46"/><rect x="86" y="0" width="86" height="46"/><rect x="172" y="0" width="86" height="46"/><rect x="258" y="0" width="86" height="46"/><rect x="344" y="0" width="86" height="46"/></g>
    <text x="17" y="32" class="t small">Cats</text><text x="100" y="32" class="t small">chase</text><text x="180" y="32" class="t small">small</text><text x="265" y="32" class="t small">mice</text><text x="357" y="32" class="t small">NEW</text><text x="10" y="76" class="muted small">old cached rows</text><text x="344" y="76" class="t small">k_new</text></g>
  <g transform="translate(100 590)"><text x="0" y="-14" class="muted small">V cache, head 0</text><rect x="0" y="0" width="430" height="40" fill="#26364d" stroke="#88a6c8"/><g class="cell vcell"><rect x="0" y="0" width="86" height="40"/><rect x="86" y="0" width="86" height="40"/><rect x="172" y="0" width="86" height="40"/><rect x="258" y="0" width="86" height="40"/><rect x="344" y="0" width="86" height="40"/></g><text x="10" y="28" class="t small">v₀</text><text x="96" y="28" class="t small">v₁</text><text x="182" y="28" class="t small">v₂</text><text x="268" y="28" class="t small">v₃</text><text x="355" y="28" class="t small">v_new</text></g>
  <path d="M590 515 H700" class="line"/><rect x="720" y="467" width="210" height="90" fill="url(#q)" class="box"/><text x="777" y="504" class="t med">q [1×3]</text><text x="752" y="532" class="muted small">one query row</text>
  <path d="M930 512 H1035" class="line"/><rect x="1055" y="438" width="290" height="150" fill="url(#p)" class="box"/><text x="1100" y="477" class="t med">qK_cacheᵀ</text><text x="1090" y="508" class="muted small">[1×3] × [3×5]</text><text x="1090" y="538" class="muted small">→ scores [1×5]</text><text x="1090" y="568" class="muted small">read 5 K rows</text>
  <text x="75" y="672" class="muted small">Cache traffic: read K_cache and V_cache for every decode step; append one k_new and one v_new row.</text>
  <path d="M800 635 V675" class="line"/>
  <rect x="50" y="685" width="1600" height="210" class="panel"/>
  <text x="75" y="722" class="t label">3. Convert scores to weights, then retrieve information from V</text>
  <g transform="translate(100 755)"><rect width="260" height="80" fill="url(#p)" class="box"/><text x="56" y="788" class="t med">P = softmax(scores)</text><text x="54" y="816" class="muted small">[1×5], sums to 1</text><path d="M280 40 H375" class="line"/><rect x="395" width="300" height="80" fill="url(#v)" class="box"/><text x="468" y="788" class="t med">o = P V_cache</text><text x="458" y="816" class="muted small">[1×5] × [5×3] → [1×3]</text><path d="M715 40 H805" class="line"/><rect x="825" width="300" height="80" fill="#223e68" class="box"/><text x="905" y="788" class="t med">next layer</text><text x="882" y="816" class="muted small">then O projection + MLP</text></g>
  <path d="M1295 588 C1450 625 1435 745 1125 795" class="dash"/><text x="1370" y="650" class="muted small">V_cache read</text>
  <text x="75" y="935" class="t med">Key contrast: prefill computes many Q rows together; decode computes one Q row but scans an ever-growing K/V cache.</text>
</svg>
