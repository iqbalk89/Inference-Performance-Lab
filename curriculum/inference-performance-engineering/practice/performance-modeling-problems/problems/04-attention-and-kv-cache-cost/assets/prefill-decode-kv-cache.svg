<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prefill versus decode KV-cache behavior</title>
  <desc id="desc">A side-by-side diagram showing prefill creates K and V rows for all prompt tokens while decode creates one new row and reads all previous cached rows.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111c31"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#8dd6ff"/></marker><style>.h{font:700 30px Inter,Arial,sans-serif;fill:#f4f8ff}.lane{font:700 23px Inter,Arial,sans-serif;fill:#e9f1ff}.label{font:700 18px Inter,Arial,sans-serif;fill:#e9f1ff}.small{font:500 15px Inter,Arial,sans-serif;fill:#b7c6dc}.tiny{font:500 13px Inter,Arial,sans-serif;fill:#8fa5c2}.line{stroke:#8dd6ff;stroke-width:3;fill:none;marker-end:url(#a)} </style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="60" y="60" class="h">KV cache: what changes between prefill and decode?</text><text x="60" y="92" class="small">K and V rows are retained so future decode steps do not recompute earlier tokens.</text>
  <rect x="45" y="135" width="730" height="690" rx="18" fill="#13283a" stroke="#4b7892" stroke-width="2"/><text x="75" y="180" class="lane">Prefill — process the whole prompt</text><text x="75" y="210" class="small">Prompt length T = 4; four rows are produced in one batched operation.</text>
  <rect x="75" y="255" width="150" height="220" rx="10" fill="#234260" stroke="#5e8db2" stroke-width="2"/><text x="150" y="290" text-anchor="middle" class="label">X prompt</text><text x="150" y="320" text-anchor="middle" class="small">4 token rows</text><g fill="#73b8de"><rect x="100" y="350" width="100" height="18"/><rect x="100" y="378" width="100" height="18"/><rect x="100" y="406" width="100" height="18"/><rect x="100" y="434" width="100" height="18"/></g>
  <rect x="270" y="300" width="185" height="120" rx="10" fill="#1d3a50" stroke="#53b8d8" stroke-width="2"/><text x="362" y="337" text-anchor="middle" class="label">Q, K, V</text><text x="362" y="368" text-anchor="middle" class="small">4 rows each</text><text x="362" y="394" text-anchor="middle" class="tiny">K/V are new cache entries</text><path d="M225 365H270" class="line"/>
  <rect x="500" y="245" width="220" height="250" rx="10" fill="#173d38" stroke="#53c9ac" stroke-width="2"/><text x="610" y="285" text-anchor="middle" class="label">KV cache after</text><text x="610" y="315" text-anchor="middle" class="small">K: [4, d_head]</text><text x="610" y="340" text-anchor="middle" class="small">V: [4, d_head]</text><g fill="#49bda2"><rect x="535" y="370" width="150" height="18"/><rect x="535" y="398" width="150" height="18"/><rect x="535" y="426" width="150" height="18"/><rect x="535" y="454" width="150" height="18"/></g><path d="M455 360H500" class="line"/>
  <text x="75" y="570" class="small">Prefill also computes QKᵀ and PV for all prompt rows.</text><text x="75" y="598" class="small">The final prompt row produces the first next-token logits.</text><text x="75" y="646" class="tiny">Cache write: T K rows + T V rows</text>

  <rect x="825" y="135" width="730" height="690" rx="18" fill="#291d31" stroke="#936070" stroke-width="2"/><text x="855" y="180" class="lane">Decode — add one token at a time</text><text x="855" y="210" class="small">At step t=5, one new q/k/v row is computed; old K/V rows are reused.</text>
  <rect x="855" y="300" width="155" height="120" rx="10" fill="#35284a" stroke="#9a7fd5" stroke-width="2"/><text x="932" y="337" text-anchor="middle" class="label">x₅</text><text x="932" y="368" text-anchor="middle" class="small">one new row</text><text x="932" y="394" text-anchor="middle" class="tiny">new token hidden state</text>
  <rect x="1055" y="300" width="185" height="120" rx="10" fill="#1d3a50" stroke="#53b8d8" stroke-width="2"/><text x="1147" y="337" text-anchor="middle" class="label">q₅, k₅, v₅</text><text x="1147" y="368" text-anchor="middle" class="small">one row each</text><text x="1147" y="394" text-anchor="middle" class="tiny">append k₅/v₅</text><path d="M1010 360H1055" class="line"/>
  <rect x="1290" y="245" width="220" height="250" rx="10" fill="#173d38" stroke="#53c9ac" stroke-width="2"/><text x="1400" y="285" text-anchor="middle" class="label">KV cache now</text><text x="1400" y="315" text-anchor="middle" class="small">K/V: [5, d_head]</text><g fill="#49bda2"><rect x="1325" y="350" width="150" height="18"/><rect x="1325" y="378" width="150" height="18"/><rect x="1325" y="406" width="150" height="18"/><rect x="1325" y="434" width="150" height="18"/><rect x="1325" y="462" width="150" height="18"/></g><path d="M1240 360H1290" class="line"/>
  <path d="M1147 420V570H1400V495" class="line"/><text x="1080" y="603" class="small">q₅ reads all 5 cached K rows</text><text x="1080" y="628" class="small">and then mixes all 5 cached V rows.</text><text x="855" y="705" class="tiny">Cache read: 5 K rows + 5 V rows</text><text x="855" y="733" class="tiny">Cache write: only the new k₅ and v₅ rows</text>
  <rect x="440" y="850" width="720" height="35" rx="10" fill="#182b40"/><text x="800" y="874" text-anchor="middle" class="small">Prefill grows the cache in bulk; decode reads an increasingly long cache for each single new token.</text>
</svg>
