<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Prefill versus decode: QKV attention and KV cache</title>
  <desc id="desc">An original two-lane technical diagram showing full prompt attention during prefill and one-token attention over a growing KV cache during decode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102844"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142b49"/><stop offset="1" stop-color="#0c1d34"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8db7df"/></marker>
    <marker id="cyanArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5edbd2"/></marker>
    <marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c693ff"/></marker>
    <style>
      .title{font:700 30px Inter,Arial,sans-serif;fill:#f2f7ff}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#a9bfd8}.lane{font:800 20px Inter,Arial,sans-serif;letter-spacing:2px}.label{font:700 16px Inter,Arial,sans-serif;fill:#f2f7ff}.small{font:400 13px Inter,Arial,sans-serif;fill:#b2c7df}.tiny{font:500 12px Inter,Arial,sans-serif;fill:#8ea8c5}.equation{font:700 15px Menlo,Consolas,monospace;fill:#f6d477}.box{fill:url(#panel);stroke:#3c638d;stroke-width:1.5}.q{fill:#243b67;stroke:#72a8ff;stroke-width:2}.k{fill:#493a22;stroke:#f1c76b;stroke-width:2}.v{fill:#164c51;stroke:#63ddd4;stroke-width:2}.cache{fill:#211d43;stroke:#c693ff;stroke-width:2}.compute{fill:#3a2d1b;stroke:#edb95b;stroke-width:2}.flow{stroke:#8db7df;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.reuse{stroke:#5edbd2;stroke-width:2.5;fill:none;marker-end:url(#cyanArrow)}.state{stroke:#c693ff;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#purpleArrow)}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="url(#bg)"/>
  <text x="56" y="54" class="title">One Transformer layer: what Prefill computes vs. what Decode reuses</text>
  <text x="56" y="82" class="subtitle">The key difference is not the operator names—it is the shape of the attention work and the growing K/V state.</text>

  <!-- Prefill lane -->
  <rect x="38" y="112" width="1524" height="390" rx="18" fill="#0a1b30" stroke="#284764"/>
  <text x="64" y="150" class="lane" fill="#6bb7ff">PREFILL · PROCESS THE PROMPT TOGETHER</text>
  <text x="64" y="176" class="small">Every prompt position gets Q, K, and V. Causal masking prevents a row from reading future positions.</text>

  <rect x="72" y="224" width="170" height="112" rx="12" class="box"/>
  <text x="92" y="254" class="label">Prompt hidden states</text><text x="92" y="281" class="equation">X [T × d]</text><text x="92" y="308" class="small">T prompt rows</text>
  <path d="M242 280 H288" class="flow"/>
  <rect x="288" y="224" width="220" height="112" rx="12" class="compute"/>
  <text x="309" y="253" class="label">QKV projection</text><text x="309" y="281" class="equation">Q,K,V = XW</text><text x="309" y="308" class="small">three logical branches</text>

  <!-- Prefill Q/K/V matrices -->
  <rect x="554" y="198" width="94" height="142" rx="10" class="q"/><text x="584" y="224" class="label">Q</text><text x="568" y="365" class="equation">[T × dₕ]</text>
  <rect x="682" y="198" width="94" height="142" rx="10" class="k"/><text x="712" y="224" class="label">K</text><text x="696" y="365" class="equation">[T × dₕ]</text>
  <rect x="810" y="198" width="94" height="142" rx="10" class="v"/><text x="840" y="224" class="label">V</text><text x="824" y="365" class="equation">[T × dₕ]</text>
  <path d="M508 250 H554" class="flow"/><path d="M508 280 H682" class="flow"/><path d="M508 310 H810" class="flow"/>
  <path d="M648 270 H966" class="flow"/><path d="M776 285 H966" class="flow"/>
  <rect x="966" y="224" width="236" height="112" rx="12" class="compute"/>
  <text x="990" y="253" class="label">Attention</text><text x="990" y="280" class="equation">P = softmax(QKᵀ)</text><text x="990" y="307" class="small">T×T score matrix + causal mask</text>
  <path d="M904 320 C930 350 950 350 990 320" class="reuse"/>
  <path d="M1202 280 H1260" class="flow"/>
  <rect x="1260" y="224" width="230" height="112" rx="12" class="compute"/>
  <text x="1282" y="253" class="label">Context</text><text x="1282" y="280" class="equation">C = P V</text><text x="1282" y="307" class="small">one contextual row per token</text>
  <path d="M1490 280 H1530" class="flow"/>
  <text x="1510" y="257" class="label" text-anchor="middle">KV rows</text><text x="1510" y="282" class="small" text-anchor="middle">write cache</text>
  <path d="M730 340 V430 H1390 V336" class="state"/>
  <path d="M858 340 V410 H1390" class="state"/>
  <rect x="1160" y="400" width="330" height="68" rx="12" class="cache"/>
  <text x="1184" y="428" class="label">KV cache after Prefill</text><text x="1184" y="452" class="small">K[0:T], V[0:T] retained per layer</text>

  <!-- Decode lane -->
  <rect x="38" y="536" width="1524" height="430" rx="18" fill="#100f25" stroke="#4b3d6c"/>
  <text x="64" y="574" class="lane" fill="#e59cff">DECODE · ONE NEW TOKEN PER STEP</text>
  <text x="64" y="600" class="small">Only the newest query is computed. Previous keys and values are read from the cache instead of recomputed.</text>

  <rect x="72" y="658" width="170" height="112" rx="12" class="box"/>
  <text x="92" y="688" class="label">New token state</text><text x="92" y="716" class="equation">xₜ [1 × d]</text><text x="92" y="744" class="small">one row only</text>
  <path d="M242 714 H288" class="flow"/>
  <rect x="288" y="658" width="220" height="112" rx="12" class="compute"/>
  <text x="309" y="687" class="label">QKV projection</text><text x="309" y="715" class="equation">qₜ,kₜ,vₜ = xₜW</text><text x="309" y="743" class="small">append new kₜ,vₜ</text>
  <rect x="554" y="632" width="94" height="142" rx="10" class="q"/><text x="584" y="658" class="label">qₜ</text><text x="566" y="799" class="equation">[1 × dₕ]</text>
  <rect x="682" y="632" width="94" height="142" rx="10" class="k"/><text x="712" y="658" class="label">kₜ</text><text x="694" y="799" class="equation">[1 × dₕ]</text>
  <rect x="810" y="632" width="94" height="142" rx="10" class="v"/><text x="840" y="658" class="label">vₜ</text><text x="822" y="799" class="equation">[1 × dₕ]</text>
  <path d="M508 684 H554" class="flow"/><path d="M508 714 H682" class="flow"/><path d="M508 744 H810" class="flow"/>
  <rect x="966" y="658" width="236" height="112" rx="12" class="compute"/>
  <text x="990" y="687" class="label">Attention</text><text x="990" y="715" class="equation">pₜ = softmax(qₜKᵀ)</text><text x="990" y="742" class="small">1×T scores over cache</text>
  <path d="M648 704 H966" class="flow"/>
  <path d="M1090 658 C1100 620 1060 610 930 620" class="reuse"/>
  <path d="M776 632 V600 H1160 V470" class="state"/>
  <path d="M858 632 V590 H1390 V468" class="state"/>
  <text x="1190" y="614" class="tiny">read K[0:t−1], V[0:t−1]</text>
  <path d="M1202 714 H1260" class="flow"/>
  <rect x="1260" y="658" width="230" height="112" rx="12" class="compute"/>
  <text x="1282" y="687" class="label">Context</text><text x="1282" y="715" class="equation">cₜ = pₜV</text><text x="1282" y="742" class="small">one output row</text>
  <path d="M1490 714 H1530" class="flow"/>
  <rect x="1530" y="658" width="190" height="112" rx="12" class="box"/>
  <text x="1550" y="687" class="label">O + MLP</text><text x="1550" y="715" class="equation">hₜ → logits</text><text x="1550" y="742" class="small">then sample token</text>
  <path d="M1720 714 H1780" class="flow"/>
  <rect x="1780" y="658" width="190" height="112" rx="12" class="cache"/>
  <text x="1800" y="687" class="label">Cache append</text><text x="1800" y="715" class="equation">K[t], V[t]</text><text x="1800" y="742" class="small">cache grows by one row</text>
  <path d="M1875 770 V900 H155 V770" class="state"/>
  <text x="1000" y="925" class="small" text-anchor="middle">Decode repeats this loop for every generated token; the cache grows while old K/V rows remain unchanged.</text>

  <rect x="64" y="990" width="18" height="18" rx="4" class="q"/><text x="92" y="1005" class="tiny">Query</text>
  <rect x="178" y="990" width="18" height="18" rx="4" class="k"/><text x="206" y="1005" class="tiny">Key</text>
  <rect x="280" y="990" width="18" height="18" rx="4" class="v"/><text x="308" y="1005" class="tiny">Value</text>
  <line x1="390" y1="999" x2="430" y2="999" class="state"/><text x="445" y="1005" class="tiny">Persistent state / cache path</text>
  <line x1="700" y1="999" x2="740" y2="999" class="reuse"/><text x="755" y="1005" class="tiny">Reused K/V data</text>
</svg>
