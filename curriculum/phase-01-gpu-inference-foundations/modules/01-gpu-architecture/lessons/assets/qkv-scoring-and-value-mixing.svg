<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Query-key scoring and weighted value mixing</title>
  <desc id="desc">A query vector for the blue token takes dot products with four key vectors, producing normalized weights. Those weights multiply four value vectors and sum into one attention-output vector.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.title{font-size:32px;font-weight:700}.h{font-size:21px;font-weight:700}.m{font-size:16px}.sub{font-size:14px;fill:#cbd5e1}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}.card{fill:#172033;stroke:#475569;stroke-width:2}.q{fill:#155e75;stroke:#67e8f9;stroke-width:2}.k{fill:#5b21b6;stroke:#c4b5fd;stroke-width:2}.v{fill:#166534;stroke:#86efac;stroke-width:2}.score{fill:#92400e;stroke:#fde68a;stroke-width:2}.arrow{stroke:#93c5fd;stroke-width:4;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1400" height="930" rx="28" fill="#0f172a"/>
  <text x="45" y="55" class="title">Attention has two separate jobs: calculate weights, then mix information</text>
  <text x="45" y="84" class="sub">Hypothetical two-feature vectors. Real attention uses larger learned vectors, scaling, masking, and softmax.</text>

  <g transform="translate(45 125)">
    <rect width="1310" height="340" rx="18" class="card"/>
    <text x="24" y="40" class="h">Job 1 — Q and K produce one relevance score per source position</text>
    <text x="24" y="72" class="sub">Destination/query position: “blue” • possible source/key positions: The, sky, is, blue</text>
    <g transform="translate(25 105)">
      <text x="0" y="28" class="m">query:</text><rect x="80" width="150" height="55" rx="8" class="q"/><text x="155" y="35" text-anchor="middle" class="mono">qblue [2,1]</text>
      <text x="255" y="35" class="h">·</text><rect x="290" width="180" height="55" rx="8" class="k"/><text x="380" y="35" text-anchor="middle" class="mono">kThe [0,1]</text><text x="495" y="35" class="mono">= 1</text>
      <text x="255" y="98" class="h">·</text><rect x="290" y="65" width="180" height="55" rx="8" class="k"/><text x="380" y="100" text-anchor="middle" class="mono">ksky [2,1]</text><text x="495" y="100" class="mono">= 5</text>
      <text x="255" y="163" class="h">·</text><rect x="290" y="130" width="180" height="55" rx="8" class="k"/><text x="380" y="165" text-anchor="middle" class="mono">kis [1,0]</text><text x="495" y="165" class="mono">= 2</text>
      <text x="255" y="228" class="h">·</text><rect x="290" y="195" width="180" height="55" rx="8" class="k"/><text x="380" y="230" text-anchor="middle" class="mono">kblue [1,1]</text><text x="495" y="230" class="mono">= 3</text>
      <line x1="570" y1="125" x2="655" y2="125" class="arrow"/>
      <text x="685" y="38" class="m">raw dot-product scores</text><g transform="translate(685 55)" class="score"><rect width="110" height="65"/><rect x="110" width="110" height="65"/><rect x="220" width="110" height="65"/><rect x="330" width="110" height="65"/></g><g class="h" text-anchor="middle"><text x="740" y="97">1</text><text x="850" y="97">5</text><text x="960" y="97">2</text><text x="1070" y="97">3</text></g><g class="sub" text-anchor="middle"><text x="740" y="142">The</text><text x="850" y="142">sky</text><text x="960" y="142">is</text><text x="1070" y="142">blue</text></g>
      <text x="685" y="190" class="m">after scaling + softmax: normalized weights</text><g transform="translate(685 205)" class="score"><rect width="110" height="55"/><rect x="110" width="110" height="55"/><rect x="220" width="110" height="55"/><rect x="330" width="110" height="55"/></g><g class="mono" text-anchor="middle"><text x="740" y="240">0.05</text><text x="850" y="240">0.60</text><text x="960" y="240">0.10</text><text x="1070" y="240">0.25</text></g><text x="1145" y="240" class="mono">sum = 1</text>
    </g>
  </g>

  <line x1="700" y1="475" x2="700" y2="525" class="arrow"/>
  <g transform="translate(45 535)">
    <rect width="1310" height="340" rx="18" class="card"/>
    <text x="24" y="40" class="h">Job 2 — the weights multiply V rows; the weighted rows are added</text>
    <text x="24" y="72" class="sub">Keys are not mixed into the output. Values are the source information being weighted.</text>
    <g transform="translate(25 80)">
      <text x="0" y="32" class="mono">0.05 ×</text><rect x="80" width="230" height="55" rx="8" class="v"/><text x="195" y="35" text-anchor="middle" class="mono">vThe</text>
      <text x="0" y="97" class="mono">0.60 ×</text><rect x="80" y="65" width="230" height="55" rx="8" class="v"/><text x="195" y="100" text-anchor="middle" class="mono">vsky</text>
      <text x="0" y="162" class="mono">0.10 ×</text><rect x="80" y="130" width="230" height="55" rx="8" class="v"/><text x="195" y="165" text-anchor="middle" class="mono">vis</text>
      <text x="0" y="227" class="mono">0.25 ×</text><rect x="80" y="195" width="230" height="55" rx="8" class="v"/><text x="195" y="230" text-anchor="middle" class="mono">vblue</text>
      <line x1="345" y1="125" x2="455" y2="125" class="arrow"/><text x="375" y="100" class="m">add</text>
      <rect x="490" y="75" width="330" height="105" rx="10" class="v"/><text x="655" y="115" text-anchor="middle" class="h">attention output</text><text x="655" y="145" text-anchor="middle" class="mono">for position “blue”</text>
      <line x1="850" y1="125" x2="945" y2="125" class="arrow"/>
      <text x="975" y="75" class="m">This output is a new vector.</text><text x="975" y="105" class="m">It contains a learned mixture of</text><text x="975" y="135" class="m">information from permitted sources.</text><text x="975" y="185" class="sub">Q + K decide the weights.</text><text x="975" y="212" class="sub">V supplies the weighted information.</text>
    </g>
  </g>
</svg>
