<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc"><title id="title">A fully labeled linear transformation from token rows to output features</title><desc id="desc">A three by two token-state matrix multiplies a two by four weight matrix to create a three by four output, with one row, column, and output cell highlighted and calculated.</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.title{font-size:32px;font-weight:700}.h{font-size:20px;font-weight:700}.m{font-size:16px}.sub{font-size:14px;fill:#cbd5e1}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}.card{fill:#172033;stroke:#475569;stroke-width:2}.x{fill:#155e75;stroke:#67e8f9}.w{fill:#5b21b6;stroke:#c4b5fd}.y{fill:#166534;stroke:#86efac}.hot{fill:#b45309;stroke:#fde68a;stroke-width:3}</style></defs><rect width="1400" height="880" rx="28" fill="#0f172a"/><text x="45" y="55" class="title">Linear layer: token rows × learned weights → transformed token rows</text><text x="45" y="84" class="sub">Hypothetical integer values make the arithmetic visible. Real weights and states are learned floating-point values.</text>
<g transform="translate(45 130)"><text x="0" y="0" class="h">X: token states</text><text x="0" y="28" class="mono">shape [3 tokens, 2 input features]</text><text x="120" y="70" class="sub">input f0</text><text x="210" y="70" class="sub">input f1</text><text x="0" y="118" class="m">token 0</text><text x="0" y="188" class="m">token 1</text><text x="0" y="258" class="m">token 2</text><g transform="translate(115 82)" stroke-width="2"><rect width="90" height="70" class="x"/><rect x="90" width="90" height="70" class="x"/><rect y="70" width="90" height="70" class="hot"/><rect x="90" y="70" width="90" height="70" class="hot"/><rect y="140" width="90" height="70" class="x"/><rect x="90" y="140" width="90" height="70" class="x"/><g class="h" text-anchor="middle"><text x="45" y="44">1</text><text x="135" y="44">2</text><text x="45" y="114">3</text><text x="135" y="114">4</text><text x="45" y="184">5</text><text x="135" y="184">6</text></g></g></g>
<text x="375" y="290" class="title">×</text><g transform="translate(435 130)"><text x="0" y="0" class="h">W: learned weights</text><text x="0" y="28" class="mono">shape [2 input, 4 output features]</text><text x="45" y="70" class="sub">out 0</text><text x="130" y="70" class="sub">out 1</text><text x="215" y="70" class="sub">out 2</text><text x="300" y="70" class="sub">out 3</text><text x="-5" y="120" class="sub">in f0</text><text x="-5" y="190" class="sub">in f1</text><g transform="translate(40 82)" stroke-width="2"><rect width="85" height="70" class="w"/><rect x="85" width="85" height="70" class="w"/><rect x="170" width="85" height="70" class="hot"/><rect x="255" width="85" height="70" class="w"/><rect y="70" width="85" height="70" class="w"/><rect x="85" y="70" width="85" height="70" class="w"/><rect x="170" y="70" width="85" height="70" class="hot"/><rect x="255" y="70" width="85" height="70" class="w"/><g class="h" text-anchor="middle"><text x="42" y="44">1</text><text x="127" y="44">0</text><text x="212" y="44">2</text><text x="297" y="44">1</text><text x="42" y="114">0</text><text x="127" y="114">1</text><text x="212" y="114">1</text><text x="297" y="114">2</text></g></g><text x="40" y="260" class="sub">Rows: input features</text><text x="40" y="285" class="sub">Columns: output features</text></g>
<text x="835" y="290" class="title">=</text><g transform="translate(900 130)"><text x="0" y="0" class="h">Y = XW: output states</text><text x="0" y="28" class="mono">shape [3 tokens, 4 output features]</text><g transform="translate(0 82)" stroke-width="2"><g class="y"><rect width="95" height="70"/><rect x="95" width="95" height="70"/><rect x="190" width="95" height="70"/><rect x="285" width="95" height="70"/><rect y="70" width="95" height="70"/><rect x="95" y="70" width="95" height="70"/><rect x="285" y="70" width="95" height="70"/><rect y="140" width="95" height="70"/><rect x="95" y="140" width="95" height="70"/><rect x="190" y="140" width="95" height="70"/><rect x="285" y="140" width="95" height="70"/></g><rect x="190" y="70" width="95" height="70" class="hot"/><g class="h" text-anchor="middle"><text x="47" y="44">1</text><text x="142" y="44">2</text><text x="237" y="44">4</text><text x="332" y="44">5</text><text x="47" y="114">3</text><text x="142" y="114">4</text><text x="237" y="114">10</text><text x="332" y="114">11</text><text x="47" y="184">5</text><text x="142" y="184">6</text><text x="237" y="184">16</text><text x="332" y="184">17</text></g></g><text x="0" y="330" class="sub">Every row remains associated with one token position.</text></g>
<g transform="translate(55 520)"><rect width="620" height="290" rx="18" class="card"/><text x="25" y="42" class="h">Highlighted output cell: Y[token 1, output feature 2]</text><text x="25" y="90" class="mono">selected X row:      [3, 4]</text><text x="25" y="125" class="mono">selected W column:   [2, 1]</text><text x="25" y="175" class="mono">Y[1,2] = (3×2) + (4×1)</text><text x="25" y="210" class="mono">       = 6 + 4 = 10</text><text x="25" y="255" class="sub">One output cell combines the shared input-feature dimension.</text></g><g transform="translate(705 520)"><rect width="640" height="290" rx="18" class="card"/><text x="25" y="42" class="h">The same shape rule at model scale</text><text x="25" y="88" class="mono">X [256 tokens, 4096 input features]</text><text x="25" y="122" class="mono">× W [4096 input, 4096 output features]</text><text x="25" y="156" class="mono">→ Y [256 tokens, 4096 output features]</text><text x="25" y="202" class="m">1,048,576 output cells</text><text x="25" y="231" class="m">× 4,096 multiply-accumulate steps per cell</text><text x="25" y="260" class="m">= 4,294,967,296 multiply-accumulate steps</text></g></svg>
