<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Anatomy of a token-state tensor with shape two by 128 by 4096</title><desc id="desc">Two sequence sheets show token rows and feature columns, with a highlighted indexed scalar, value-count hierarchy, storage sizes, and contiguous strides.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.title{font-size:32px;font-weight:700}.h{font-size:21px;font-weight:700}.m{font-size:16px}.sub{font-size:15px;fill:#cbd5e1}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}.card{fill:#172033;stroke:#475569;stroke-width:2}.sheet{fill:#164e63;stroke:#67e8f9;stroke-width:2}.hot{fill:#7c3aed;stroke:#ddd6fe;stroke-width:3}</style></defs><rect width="1400" height="900" rx="28" fill="#0f172a"/><text x="45" y="55" class="title">Inside H with shape [2 sequences, 128 tokens, 4,096 features]</text><text x="45" y="85" class="sub">Not to scale. Ellipses omit positions from the drawing; the data still contains every position.</text>
<g transform="translate(55 125)"><rect x="50" y="0" width="760" height="245" rx="15" fill="#334155" stroke="#94a3b8" stroke-width="2"/><text x="70" y="34" class="h">batch 0 — sequence 0</text><rect x="0" y="75" width="760" height="245" rx="15" class="sheet"/><text x="20" y="110" class="h">batch 1 — sequence 1</text><g transform="translate(170 130)"><text x="30" y="-12" class="sub">feature 0</text><text x="140" y="-12" class="sub">feature 1</text><text x="290" y="-12" class="sub">…</text><text x="390" y="-12" class="sub">feature 37</text><text x="570" y="-12" class="sub">feature 4095</text><g stroke="#67e8f9" fill="#155e75"><rect width="640" height="150"/><line x1="110" y1="0" x2="110" y2="150"/><line x1="220" y1="0" x2="220" y2="150"/><line x1="350" y1="0" x2="350" y2="150"/><line x1="500" y1="0" x2="500" y2="150"/><line x1="0" y1="50" x2="640" y2="50"/><line x1="0" y1="100" x2="640" y2="100"/></g><rect x="350" y="50" width="150" height="50" class="hot"/><text x="-115" y="32" class="m">token 0</text><text x="-115" y="82" class="m">token 5</text><text x="-115" y="132" class="m">token 127</text><text x="280" y="32" class="sub">values …</text><text x="425" y="82" text-anchor="middle" class="mono">H[1,5,37]</text><text x="280" y="132" class="sub">values …</text></g><text x="20" y="354" class="m">One cell = one number • one row = one 4,096-value token vector • one sheet = one sequence</text></g>
<g transform="translate(890 125)"><rect width="455" height="355" rx="18" class="card"/><text x="24" y="40" class="h">Count values by nesting</text><text x="24" y="85" class="mono">per token:</text><text x="235" y="85" class="mono">4,096</text><text x="24" y="125" class="mono">per sequence:</text><text x="235" y="125" class="mono">128 × 4,096</text><text x="235" y="153" class="mono">= 524,288</text><text x="24" y="195" class="mono">whole batch:</text><text x="235" y="195" class="mono">2 × 524,288</text><text x="235" y="223" class="mono">= 1,048,576</text><line x1="24" y1="250" x2="430" y2="250" stroke="#475569"/><text x="24" y="285" class="sub">There are 256 token vectors total:</text><text x="24" y="315" class="mono">2 sequences × 128 positions</text><text x="24" y="340" class="sub">Each vector contains 4,096 numbers—not words.</text></g>
<g transform="translate(55 545)"><rect width="625" height="300" rx="18" class="card"/><text x="24" y="40" class="h">Same shape, different dtype and storage</text><text x="24" y="80" class="mono">FP32   4 bytes/value  → 4 MiB</text><text x="24" y="120" class="mono">FP16   2 bytes/value  → 2 MiB</text><text x="24" y="160" class="mono">BF16   2 bytes/value  → 2 MiB</text><text x="24" y="200" class="mono">INT8   1 byte/value   → 1 MiB</text><text x="24" y="245" class="sub">Example: 1,048,576 × 2 bytes = 2,097,152 bytes = 2 MiB.</text><text x="24" y="275" class="sub">Shape counts positions; dtype controls their representation and byte size.</text></g>
<g transform="translate(710 545)"><rect width="635" height="300" rx="18" class="card"/><text x="24" y="40" class="h">Example tensor metadata and contiguous strides</text><text x="24" y="80" class="mono">shape:   [2, 128, 4096]</text><text x="24" y="112" class="mono">dtype:   float16</text><text x="24" y="144" class="mono">device:  cuda:0 (first CUDA-visible GPU)</text><text x="24" y="176" class="mono">strides: [524288, 4096, 1] elements</text><text x="24" y="215" class="sub">feature +1 → move 1 value; token +1 → move 4,096 values;</text><text x="24" y="242" class="sub">batch +1 → move 524,288 values in contiguous row-major storage.</text><text x="24" y="275" class="mono">offset(b,t,h) = b×524288 + t×4096 + h</text></g></svg>
