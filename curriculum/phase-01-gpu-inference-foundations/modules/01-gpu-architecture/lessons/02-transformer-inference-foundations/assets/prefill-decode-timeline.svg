<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
  <title id="title">Prefill and decode timeline with token selection and cache growth</title>
  <desc id="desc">A chronological timeline follows the prompt Cats chase mice. Prefill caches prompt positions zero through two and selects at. The diagram highlights that at is selected but not yet cached. Decode then processes at, caches position three, and selects night, which likewise remains one position ahead of the cache until the next decode pass.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.title{font-size:32px;font-weight:750}.subtitle{font-size:17px;fill:#cbd5e1}.h{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:650}.body{font-size:15px;fill:#e2e8f0}.small{font-size:13px;fill:#cbd5e1}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}.card{fill:#162033;stroke:#475569;stroke-width:2}.prefill{fill:#164e63;stroke:#67e8f9;stroke-width:2}.decode{fill:#1e3a8a;stroke:#93c5fd;stroke-width:2}.cache{fill:#4c1d95;stroke:#c4b5fd;stroke-width:2}.selected{fill:#7c2d12;stroke:#fb923c;stroke-width:2}.pending{fill:#321b13;stroke:#fb923c;stroke-width:3;stroke-dasharray:9 6}.unknown{fill:#27272a;stroke:#fbbf24;stroke-width:2;stroke-dasharray:7 6}.line{stroke:#64748b;stroke-width:5}.arrow{fill:none;stroke:#93c5fd;stroke-width:4;marker-end:url(#arrow)}.orange{fill:none;stroke:#fb923c;stroke-width:3;marker-end:url(#orangeArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#93c5fd"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#fb923c"/></marker>
  </defs>

  <rect width="1400" height="1060" rx="28" fill="#0f172a"/>
  <text x="50" y="58" class="title">Generation is a repeated handoff: forward pass → logits → select → next pass</text>
  <text x="50" y="88" class="subtitle">The selected token ID is always one step ahead of its K/V cache entry until the next forward pass processes it.</text>

  <line x1="115" y1="150" x2="115" y2="980" class="line"/>

  <g transform="translate(60 125)">
    <circle cx="55" cy="25" r="19" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><text x="55" y="31" text-anchor="middle" class="label">0</text>
    <g transform="translate(105 0)"><rect width="1185" height="125" rx="18" class="card"/><text x="22" y="34" class="h">Request arrives</text>
      <text x="22" y="66" class="body">Sequence IDs:</text><rect x="135" y="45" width="155" height="48" rx="8" class="prefill"/><rect x="300" y="45" width="155" height="48" rx="8" class="prefill"/><rect x="465" y="45" width="155" height="48" rx="8" class="prefill"/><rect x="650" y="45" width="125" height="48" rx="8" class="unknown"/>
      <g class="label" text-anchor="middle"><text x="212" y="75">0 · Cats</text><text x="377" y="75">1 · chase</text><text x="542" y="75">2 · mice</text><text x="712" y="75">3 · ?</text></g>
      <text x="815" y="63" class="mono">cache length = 0</text><text x="815" y="86" class="small">Nothing has passed through the model.</text>
    </g>
  </g>

  <path d="M115 265V315" class="arrow"/>
  <g transform="translate(60 310)">
    <circle cx="55" cy="25" r="19" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><text x="55" y="31" text-anchor="middle" class="label">1</text>
    <g transform="translate(105 0)"><rect width="1185" height="145" rx="18" class="card"/><text x="22" y="34" class="h">Prefill forward processes prompt positions 0–2</text>
      <rect x="22" y="52" width="330" height="60" rx="10" class="prefill"/><text x="187" y="78" text-anchor="middle" class="label">model forward: [Cats, chase, mice]</text><text x="187" y="100" text-anchor="middle" class="small">many prompt rows in each layer</text>
      <path d="M370 82H435" class="arrow"/><rect x="450" y="52" width="270" height="60" rx="10" class="cache"/><text x="585" y="78" text-anchor="middle" class="label">per-layer cache</text><text x="585" y="100" text-anchor="middle" class="mono">K0–K2 · V0–V2</text>
      <path d="M738 82H803" class="arrow"/><rect x="818" y="52" width="160" height="60" rx="10" fill="#713f12" stroke="#fbbf24" stroke-width="2"/><text x="898" y="78" text-anchor="middle" class="label">last-row logits</text><text x="898" y="100" text-anchor="middle" class="small">predict position 3</text>
      <path d="M993 82H1045" class="arrow"/><rect x="1060" y="52" width="100" height="60" rx="10" class="selected"/><text x="1110" y="89" text-anchor="middle" class="h">at</text>
    </g>
  </g>

  <path d="M115 470V520" class="arrow"/>
  <g transform="translate(60 515)">
    <circle cx="55" cy="25" r="19" fill="#c2410c" stroke="#fb923c" stroke-width="3"/><text x="55" y="31" text-anchor="middle" class="label">2</text>
    <g transform="translate(105 0)"><rect width="1185" height="130" rx="18" class="pending"/><text x="22" y="34" class="h">Boundary moment: “ at” is selected, not processed</text>
      <text x="22" y="67" class="body">Sequence IDs contain:</text><text x="170" y="67" class="mono">[Cats, chase, mice, at]</text>
      <text x="22" y="96" class="body">Cache contains:</text><text x="170" y="96" class="mono">positions 0–2 only</text>
      <rect x="550" y="48" width="250" height="55" rx="9" class="cache"/><text x="675" y="72" text-anchor="middle" class="mono">K0–K2 · V0–V2</text><text x="675" y="92" text-anchor="middle" class="small">cache length 3</text>
      <path d="M820 76H900" class="orange"/><rect x="915" y="48" width="230" height="55" rx="9" class="selected"/><text x="1030" y="72" text-anchor="middle" class="label">pending decode input: at</text><text x="1030" y="92" text-anchor="middle" class="small">no K3/V3 yet</text>
    </g>
  </g>

  <path d="M115 660V710" class="arrow"/>
  <g transform="translate(60 705)">
    <circle cx="55" cy="25" r="19" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/><text x="55" y="31" text-anchor="middle" class="label">3</text>
    <g transform="translate(105 0)"><rect width="1185" height="145" rx="18" class="card"/><text x="22" y="34" class="h">Decode forward 1 processes “ at” at position 3</text>
      <rect x="22" y="52" width="270" height="60" rx="10" class="decode"/><text x="157" y="78" text-anchor="middle" class="label">model forward: [at]</text><text x="157" y="100" text-anchor="middle" class="small">plus the existing cache</text>
      <path d="M310 82H375" class="arrow"/><rect x="390" y="52" width="300" height="60" rx="10" class="cache"/><text x="540" y="78" text-anchor="middle" class="label">append the newly computed row</text><text x="540" y="100" text-anchor="middle" class="mono">K0–K3 · V0–V3</text>
      <path d="M708 82H773" class="arrow"/><rect x="788" y="52" width="190" height="60" rx="10" fill="#713f12" stroke="#fbbf24" stroke-width="2"/><text x="883" y="78" text-anchor="middle" class="label">new logits</text><text x="883" y="100" text-anchor="middle" class="small">predict position 4</text>
      <path d="M993 82H1045" class="arrow"/><rect x="1060" y="52" width="100" height="60" rx="10" class="selected"/><text x="1110" y="89" text-anchor="middle" class="h">night</text>
    </g>
  </g>

  <path d="M115 865V915" class="arrow"/>
  <g transform="translate(60 910)">
    <circle cx="55" cy="25" r="19" fill="#c2410c" stroke="#fb923c" stroke-width="3"/><text x="55" y="31" text-anchor="middle" class="label">4</text>
    <g transform="translate(105 0)"><rect width="1185" height="105" rx="18" class="pending"/><text x="22" y="34" class="h">The same boundary repeats</text>
      <text x="22" y="67" class="body">“ night” is selected at position 4, while the cache still ends at position 3.</text><text x="22" y="91" class="small">Decode forward 2 must process “ night” before K4/V4 exist; then it will select the following token.</text>
      <rect x="760" y="48" width="180" height="42" rx="8" class="cache"/><text x="850" y="74" text-anchor="middle" class="mono">cache: 0–3</text><path d="M955 69H1000" class="orange"/><rect x="1015" y="48" width="145" height="42" rx="8" class="selected"/><text x="1087" y="74" text-anchor="middle" class="label">pending: night</text>
    </g>
  </g>
</svg>
