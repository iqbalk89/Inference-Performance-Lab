<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">A prefill forward pass processes the prompt and selects the first output token</title>
  <desc id="desc">A five-stage diagram follows the prompt Cats chase mice through token input, parallel prompt-row computation across sequential transformer layers, per-layer key-value cache creation, last-row logits, and selection of the token at. A final callout emphasizes that the selected token at has not yet been processed and is therefore not yet represented in the cache.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.title{font-size:32px;font-weight:750}.subtitle{font-size:17px;fill:#cbd5e1}.h{font-size:21px;font-weight:700}.label{font-size:16px;font-weight:650}.body{font-size:15px;fill:#e2e8f0}.small{font-size:13px;fill:#cbd5e1}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}.panel{fill:#162033;stroke:#475569;stroke-width:2}.prompt{fill:#0e7490;stroke:#67e8f9;stroke-width:2}.compute{fill:#1e3a5f;stroke:#60a5fa;stroke-width:2}.cache{fill:#4c1d95;stroke:#c4b5fd;stroke-width:2}.logits{fill:#713f12;stroke:#fbbf24;stroke-width:2}.selected{fill:#7c2d12;stroke:#fb923c;stroke-width:2}.future{fill:#27272a;stroke:#fbbf24;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#93c5fd;stroke-width:4;marker-end:url(#arrow)}.thin{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#smallArrow)}.dash{fill:none;stroke:#fb923c;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#orangeArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#93c5fd"/></marker>
    <marker id="smallArrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#64748b"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#fb923c"/></marker>
  </defs>

  <rect width="1400" height="980" rx="28" fill="#0f172a"/>
  <text id="titleText" x="50" y="58" class="title">Prefill: process the prompt, build its cache, predict one next token</text>
  <text x="50" y="88" class="subtitle">Teaching example (hypothetical tokenization): “Cats chase mice” → first selected output token “ at”</text>

  <g transform="translate(50 125)">
    <rect width="1300" height="150" rx="18" class="panel"/>
    <text x="24" y="36" class="h">1 · The request already contains all three prompt token IDs</text>
    <g transform="translate(25 58)">
      <rect width="205" height="62" rx="9" class="prompt"/><rect x="220" width="205" height="62" rx="9" class="prompt"/><rect x="440" width="205" height="62" rx="9" class="prompt"/>
      <text x="102" y="38" text-anchor="middle" class="label">position 0 · Cats</text><text x="322" y="38" text-anchor="middle" class="label">position 1 · chase</text><text x="542" y="38" text-anchor="middle" class="label">position 2 · mice</text>
      <rect x="700" width="190" height="62" rx="9" class="future"/><text x="795" y="28" text-anchor="middle" class="label">position 3 · ?</text><text x="795" y="49" text-anchor="middle" class="small">no token ID exists yet</text>
      <text x="940" y="25" class="body">Prompt IDs can enter one forward call together.</text><text x="940" y="50" class="small">“Present in the request” does not mean every row may attend everywhere.</text>
    </g>
  </g>

  <path d="M700 282V322" class="arrow"/>

  <g transform="translate(50 330)">
    <rect width="1300" height="270" rx="18" class="panel"/>
    <text x="24" y="38" class="h">2 · Every transformer layer handles three prompt rows; model depth remains sequential</text>
    <g transform="translate(25 68)">
      <rect width="250" height="150" rx="12" class="compute"/><text x="125" y="30" text-anchor="middle" class="label">Transformer layer 0</text>
      <g class="mono"><text x="22" y="65">row 0  Cats</text><text x="22" y="91">row 1  chase</text><text x="22" y="117">row 2  mice</text></g><text x="125" y="140" text-anchor="middle" class="small">row operations expose parallel work</text>
      <path d="M282 75H342" class="arrow"/>
      <rect x="350" width="250" height="150" rx="12" class="compute"/><text x="475" y="30" text-anchor="middle" class="label">Transformer layer 1</text>
      <g class="mono"><text x="372" y="65">row 0  Cats</text><text x="372" y="91">row 1  chase</text><text x="372" y="117">row 2  mice</text></g><text x="475" y="140" text-anchor="middle" class="small">receives layer 0 outputs</text>
      <path d="M632 75H692" class="arrow"/>
      <rect x="700" width="250" height="150" rx="12" class="compute"/><text x="825" y="30" text-anchor="middle" class="label">… final layer</text>
      <g class="mono"><text x="722" y="65">row 0  prefix: Cats</text><text x="722" y="91">row 1  prefix: Cats chase</text><text x="722" y="117">row 2  full prompt</text></g><text x="825" y="140" text-anchor="middle" class="small">causal visibility differs by row</text>
      <rect x="1000" width="250" height="150" rx="12" class="cache"/><text x="1125" y="30" text-anchor="middle" class="label">Built at every layer</text>
      <text x="1020" y="68" class="mono">K: [K0 K1 K2]</text><text x="1020" y="96" class="mono">V: [V0 V1 V2]</text><text x="1125" y="126" text-anchor="middle" class="small">cache covers prompt positions 0–2</text>
      <path d="M950 165C975 185 990 180 1010 150" class="thin"/>
    </g>
  </g>

  <path d="M700 608V648" class="arrow"/>

  <g transform="translate(50 655)">
    <rect width="1300" height="145" rx="18" class="panel"/>
    <text x="24" y="38" class="h">3 · The final prompt row supplies logits for the next position</text>
    <rect x="30" y="62" width="260" height="58" rx="9" class="compute"/><text x="160" y="87" text-anchor="middle" class="label">final hidden row for “mice”</text><text x="160" y="108" text-anchor="middle" class="small">represents the full allowed prefix</text>
    <path d="M305 91H375" class="arrow"/>
    <rect x="390" y="62" width="300" height="58" rx="9" class="logits"/><text x="540" y="87" text-anchor="middle" class="label">vocabulary logits</text><text x="540" y="108" text-anchor="middle" class="small">one score for every possible next token</text>
    <path d="M705 91H775" class="arrow"/>
    <rect x="790" y="62" width="205" height="58" rx="9" class="logits"/><text x="892" y="87" text-anchor="middle" class="label">sampling policy</text><text x="892" y="108" text-anchor="middle" class="small">chooses one token ID</text>
    <path d="M1010 91H1080" class="arrow"/>
    <rect x="1095" y="62" width="170" height="58" rx="9" class="selected"/><text x="1180" y="98" text-anchor="middle" class="h">“ at”</text>
  </g>

  <g transform="translate(50 825)">
    <rect width="1300" height="115" rx="18" fill="#321b13" stroke="#fb923c" stroke-width="3"/>
    <text x="24" y="35" class="h">4 · Critical boundary: “ at” is selected, but it has not passed through the model yet</text>
    <text x="24" y="66" class="body">Sequence IDs now contain positions 0–3: <tspan class="mono">[Cats, chase, mice, at]</tspan></text>
    <text x="24" y="94" class="body">The cache still contains only positions 0–2: <tspan class="mono">K0–K2 and V0–V2</tspan></text>
    <path d="M930 62H1040" class="dash"/><rect x="1055" y="42" width="215" height="48" rx="9" class="selected"/><text x="1162" y="62" text-anchor="middle" class="label">next decode input</text><text x="1162" y="81" text-anchor="middle" class="small">processing “ at” creates K3/V3</text>
  </g>
</svg>
