<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Tensor rank and shape from scalar through rank-three token states</title>
<desc id="desc">Four labeled panels show a scalar, vector, matrix, and two stacked token-state matrices with axes, shapes, ranks, indices, and example values.</desc>
<defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#cbd5e1}.h{font-size:21px;font-weight:700}.m{font-size:16px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}.cell{fill:#155e75;stroke:#67e8f9;stroke-width:2}.hot{fill:#6d28d9;stroke:#c4b5fd;stroke-width:3}.panel{fill:#172033;stroke:#475569;stroke-width:2}.axis{stroke:#fbbf24;stroke-width:3;marker-end:url(#a)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="#0f172a"/><text x="50" y="58" class="title">How rank, axes, shape, and indices fit together</text><text x="50" y="88" class="sub">Each colored cell is one scalar value. Shapes list axis lengths in index order. Hypothetical teaching values.</text>
<g transform="translate(40 125)"><rect class="panel" width="300" height="560" rx="20"/><text x="24" y="42" class="h">Rank 0 — scalar</text><text x="24" y="70" class="mono">shape = []</text><rect x="105" y="150" width="90" height="90" rx="10" class="hot"/><text x="150" y="206" text-anchor="middle" class="h">7</text><text x="24" y="290" class="m">No axis is needed.</text><text x="24" y="318" class="mono">T = 7</text><text x="24" y="365" class="sub">Rank = number of axes,</text><text x="24" y="390" class="sub">not number of values.</text></g>
<g transform="translate(365 125)"><rect class="panel" width="300" height="560" rx="20"/><text x="24" y="42" class="h">Rank 1 — vector</text><text x="24" y="70" class="mono">shape = [3]</text><text x="67" y="130" class="sub">index 0</text><text x="137" y="130" class="sub">1</text><text x="207" y="130" class="sub">2</text><rect x="40" y="145" width="70" height="70" class="cell"/><rect x="110" y="145" width="70" height="70" class="hot"/><rect x="180" y="145" width="70" height="70" class="cell"/><text x="75" y="188" text-anchor="middle" class="h">2</text><text x="145" y="188" text-anchor="middle" class="h">4</text><text x="215" y="188" text-anchor="middle" class="h">6</text><line x1="40" y1="250" x2="250" y2="250" class="axis"/><text x="145" y="280" text-anchor="middle" class="m">axis 0: length 3</text><text x="24" y="330" class="mono">T[1] = 4</text><text x="24" y="365" class="sub">One index selects</text><text x="24" y="390" class="sub">one value.</text></g>
<g transform="translate(690 125)"><rect class="panel" width="300" height="560" rx="20"/><text x="24" y="42" class="h">Rank 2 — matrix</text><text x="24" y="70" class="mono">shape = [2, 2]</text><text x="120" y="120" class="sub">column 0</text><text x="205" y="120" class="sub">column 1</text><text x="25" y="165" class="sub">row 0</text><text x="25" y="235" class="sub">row 1</text><rect x="105" y="130" width="75" height="70" class="cell"/><rect x="180" y="130" width="75" height="70" class="cell"/><rect x="105" y="200" width="75" height="70" class="hot"/><rect x="180" y="200" width="75" height="70" class="cell"/><text x="142" y="174" text-anchor="middle" class="h">1</text><text x="217" y="174" text-anchor="middle" class="h">2</text><text x="142" y="244" text-anchor="middle" class="h">3</text><text x="217" y="244" text-anchor="middle" class="h">4</text><line x1="105" y1="305" x2="255" y2="305" class="axis"/><text x="180" y="335" text-anchor="middle" class="m">axis 1: columns</text><line x1="75" y1="130" x2="75" y2="270" class="axis"/><text x="24" y="365" class="m">axis 0: rows</text><text x="24" y="410" class="mono">T[1, 0] = 3</text><text x="24" y="445" class="sub">shape order:</text><text x="24" y="470" class="mono">[rows, columns]</text></g>
<g transform="translate(1015 125)"><rect class="panel" width="345" height="560" rx="20"/><text x="24" y="42" class="h">Rank 3 — token states</text><text x="24" y="70" class="mono">shape = [2, 4, 3]</text><text x="24" y="98" class="sub">T[batch, token, feature]</text><g transform="translate(75 135)"><rect x="30" y="-25" width="180" height="140" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/><text x="220" y="0" class="sub">batch 0</text><rect x="0" y="30" width="180" height="140" rx="8" fill="#155e75" stroke="#67e8f9" stroke-width="2"/><text x="190" y="55" class="sub">batch 1</text><g stroke="#67e8f9"><line x1="60" y1="30" x2="60" y2="170"/><line x1="120" y1="30" x2="120" y2="170"/><line x1="0" y1="65" x2="180" y2="65"/><line x1="0" y1="100" x2="180" y2="100"/><line x1="0" y1="135" x2="180" y2="135"/></g><rect x="0" y="100" width="60" height="35" class="hot"/><text x="30" y="124" text-anchor="middle" class="m">★</text></g><text x="24" y="350" class="mono">T[1, 2, 0] = ★</text><text x="24" y="385" class="m">2 sheets = batch axis</text><text x="24" y="413" class="m">4 rows = token axis</text><text x="24" y="441" class="m">3 columns = feature axis</text><text x="24" y="485" class="sub">A rank-3 tensor is logically</text><text x="24" y="510" class="sub">a stack of matrices; it need</text><text x="24" y="535" class="sub">not be a physical cube.</text></g>
</svg>
