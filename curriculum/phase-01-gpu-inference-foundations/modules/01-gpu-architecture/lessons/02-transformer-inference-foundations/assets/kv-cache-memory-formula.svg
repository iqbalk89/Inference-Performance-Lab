<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">KV cache memory formula by architectural dimension</title>
  <desc id="desc">Seven labeled factors multiply to produce raw KV cache bytes. A tiny example gives 192 bytes and a realistic hypothetical grouped-query model gives 512 MiB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#101d32"/></linearGradient>
    <style>.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:"SFMono-Regular",Consolas,monospace}.t{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#a9bad1}.h{font-size:22px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#dbe6f2}.sm{font-size:14px;fill:#b1c3d8}.num{font-size:29px;font-weight:800;fill:#fff}.op{font-size:25px;font-weight:700;fill:#7891ad}.panel{fill:#101d31;stroke:#36506f;stroke-width:1.5}.factor{fill:#172840;stroke:#557497;stroke-width:1.5}</style>
  </defs>
  <rect width="1400" height="900" rx="22" fill="url(#bg)"/>
  <text x="65" y="68" class="s t">Raw KV-cache memory, one factor at a time</text>
  <text x="65" y="104" class="s sub">Each retained token contributes one K vector and one V vector at every layer and KV head.</text>
  <text x="65" y="158" class="s h">KV bytes =</text>
  <g transform="translate(65 185)">
    <g><rect width="150" height="135" rx="14" fill="#123d50" stroke="#30c9df" stroke-width="2"/><text x="75" y="50" text-anchor="middle" class="s num">2</text><text x="75" y="81" text-anchor="middle" class="s b">K and V</text><text x="75" y="108" text-anchor="middle" class="s sm">two tensors</text></g>
    <text x="166" y="76" class="s op">×</text>
    <g transform="translate(195)"><rect width="150" height="135" rx="14" class="factor"/><text x="75" y="50" text-anchor="middle" class="s num">B</text><text x="75" y="81" text-anchor="middle" class="s b">batch</text><text x="75" y="108" text-anchor="middle" class="s sm">sequences</text></g>
    <text x="361" y="76" class="s op">×</text>
    <g transform="translate(390)"><rect width="150" height="135" rx="14" class="factor"/><text x="75" y="50" text-anchor="middle" class="s num">L</text><text x="75" y="81" text-anchor="middle" class="s b">layers</text><text x="75" y="108" text-anchor="middle" class="s sm">cache per layer</text></g>
    <text x="556" y="76" class="s op">×</text>
    <g transform="translate(585)"><rect width="150" height="135" rx="14" class="factor"/><text x="75" y="50" text-anchor="middle" class="s num">H<tspan baseline-shift="sub" font-size="17">kv</tspan></text><text x="75" y="81" text-anchor="middle" class="s b">KV heads</text><text x="75" y="108" text-anchor="middle" class="s sm">not always Q heads</text></g>
    <text x="751" y="76" class="s op">×</text>
    <g transform="translate(780)"><rect width="150" height="135" rx="14" class="factor"/><text x="75" y="50" text-anchor="middle" class="s num">T</text><text x="75" y="81" text-anchor="middle" class="s b">tokens</text><text x="75" y="108" text-anchor="middle" class="s sm">retained positions</text></g>
    <text x="946" y="76" class="s op">×</text>
    <g transform="translate(975)"><rect width="150" height="135" rx="14" class="factor"/><text x="75" y="50" text-anchor="middle" class="s num">D<tspan baseline-shift="sub" font-size="17">h</tspan></text><text x="75" y="81" text-anchor="middle" class="s b">head width</text><text x="75" y="108" text-anchor="middle" class="s sm">values per vector</text></g>
    <text x="1141" y="76" class="s op">×</text>
    <g transform="translate(1170)"><rect width="150" height="135" rx="14" class="factor"/><text x="75" y="50" text-anchor="middle" class="s num">S</text><text x="75" y="81" text-anchor="middle" class="s b">bytes/value</text><text x="75" y="108" text-anchor="middle" class="s sm">FP16/BF16 = 2</text></g>
  </g>

  <g transform="translate(65 370)">
    <rect width="610" height="380" rx="18" class="panel"/>
    <text x="30" y="45" class="s h">Tiny example: see every dimension</text>
    <text x="30" y="82" class="m b">B=1  L=2  Hkv=2  T=4  Dh=3  S=2</text>
    <rect x="30" y="110" width="550" height="68" rx="12" fill="#172840" stroke="#30c9df" stroke-width="1.5"/>
    <text x="305" y="152" text-anchor="middle" class="m h">2 × 1 × 2 × 2 × 4 × 3 × 2 = 192 bytes</text>
    <text x="30" y="221" class="s b">Cost of one additional retained token:</text>
    <text x="30" y="255" class="m b">2 × 1 × 2 × 2 × 1 × 3 × 2 = 48 bytes/token</text>
    <text x="30" y="302" class="s b">After three more processed tokens:</text>
    <text x="30" y="336" class="m b">7 tokens × 48 bytes/token = 336 bytes</text>
  </g>

  <g transform="translate(705 370)">
    <rect width="630" height="380" rx="18" class="panel"/>
    <text x="30" y="45" class="s h">Hypothetical grouped-query model</text>
    <text x="30" y="82" class="m b">B=1  L=32  Hkv=8  T=4096  Dh=128  S=2</text>
    <rect x="30" y="110" width="570" height="96" rx="12" fill="#172840" stroke="#c084fc" stroke-width="1.5"/>
    <text x="315" y="149" text-anchor="middle" class="m b">2 × 1 × 32 × 8 × 4096 × 128 × 2</text>
    <text x="315" y="181" text-anchor="middle" class="s h">= 536,870,912 bytes = 512 MiB</text>
    <text x="30" y="250" class="s b">Per retained token, one sequence:</text>
    <text x="30" y="282" class="m b">512 MiB ÷ 4096 = 128 KiB/token</text>
    <text x="30" y="326" class="s b">Eight equal-length sequences:</text>
    <text x="30" y="358" class="m b">8 × 512 MiB = 4 GiB</text>
  </g>
  <rect x="65" y="785" width="1270" height="70" rx="13" fill="#17263a" stroke="#f5b942" stroke-width="1.5"/>
  <text x="700" y="815" text-anchor="middle" class="s b">This is raw tensor storage. Real serving may add reserved capacity, padding, block fragmentation,</text>
  <text x="700" y="840" text-anchor="middle" class="s b">metadata, and sharding effects. GQA/MQA save cache memory because H<tspan baseline-shift="sub">kv</tspan> can be smaller than the query-head count.</text>
</svg>
