[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-performance-workbench"
version = "0.1.0"
description = "Composable analytical models and visual contracts for LLM inference performance"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
